genesis:
  consensus:
    params:
      abci:
        vote_extensions_enable_height: "1"
  app_state:
    bank:
      denom_metadata:
      - base: uspark.sparkdream
        denom_units:
        - denom: uspark.sparkdream
          exponent: 0
        - denom: spark
          exponent: 6
        description: Native token of Spark Dream A T E L I E R.
        display: spark
        name: spark
        symbol: spark
      - base: udream.sparkdream
        denom_units:
        - denom: udream.sparkdream
          exponent: 0
        - denom: dream
          exponent: 6
        description: Internal coordination token - earned through contribution, not traded.
        display: dream
        name: dream
        symbol: dream
    commons:
      params:
        proposal_fee: "5000000uspark.sparkdream"
      category_map:
      - category_id: 1
        title: "General"
        description: "General discussion"
        members_only_write: false
        admin_only_write: false
      - category_id: 2
        title: "Governance"
        description: "Governance proposals and discussion"
        members_only_write: true
        admin_only_write: false
      - category_id: 3
        title: "Announcements"
        description: "Official chain announcements — upgrades, season transitions, council notices, security advisories"
        members_only_write: false
        admin_only_write: true
      - category_id: 4
        title: "Help & Support"
        description: "Onboarding questions and general support — open to non-members"
        members_only_write: false
        admin_only_write: false
      - category_id: 5
        title: "Bugs & Feedback"
        description: "Bug reports and feedback on the chain, modules, and UX"
        members_only_write: false
        admin_only_write: false
      - category_id: 6
        title: "Initiatives & Projects"
        description: "Coordination on x/rep initiatives, x/reveal contributions, and member projects"
        members_only_write: true
        admin_only_write: false
      next_category_id: 7
    gnovm:
      params:
        sysnames_pkgpath: ""
        chain_domain: "gno.land"
        default_deposit: "100000uspark.sparkdream"
        storage_price: "1uspark.sparkdream"
    distribution:
      fee_pool:
        community_pool:
        - denom: uspark.sparkdream
          amount: "95000000000000"  # 95,000,000 SPARK (95%) — x/split routes to councils on first block
      params:
        community_tax: "0.15"
    gov:
      params:
        max_deposit_period: "172800s"      # 48 hours (MAINNET production value)
        min_deposit:
          - amount: "50000000"
            denom: uspark.sparkdream
        voting_period: "432000s"           # 5 days (MAINNET production value)
        expedited_min_deposit:
          - amount: "100000000"
            denom: uspark.sparkdream
        expedited_voting_period: "86400s"  # 1 day (MAINNET production value)
    mint:
      params:
        mint_denom: uspark.sparkdream
        goal_bonded: "0.67"
        inflation_max: "0.05"
        inflation_min: "0.02"
        inflation_rate_change: "0.13"
    staking:
      params:
        bond_denom: uspark.sparkdream
    season:
      season:
        number: 1
        name: "Genesis Season"
        theme: "The Beginning"
        start_block: 1
        end_block: 2160001  # epoch_blocks * season_duration_epochs (14400 * 150) + start_block
        status: SEASON_STATUS_ACTIVE
        extensions_count: 0
        total_extension_epochs: 0
        original_end_block: 2160001
      params:
        # MUST equal rep's epoch_blocks: the seasonal pool drains in x/rep epochs
        # while this module's transitions refill it, so a mismatch desynchronizes
        # the two cadences (enforced by the cross-network epoch-alignment test).
        epoch_blocks: "14400"             # ~1 day at 6s blocks (MAINNET production value; matches rep)
        season_duration_epochs: "150"     # ~5 months (MAINNET production value)
        transition_batch_size: "100"      # MAINNET production value
        transition_grace_period: "50400"  # ~1 week in blocks (MAINNET production value)
        display_name_appeal_period_blocks: "100800"  # ~7 days (MAINNET production value)
