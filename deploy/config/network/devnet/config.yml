        min_curator_age_blocks: "300"
    shield:
      # Groth16 verifying key for the shield circuit. Production builds reject
      # every MsgShieldedExec until one is stored, and only genesis or a chain
      # upgrade can store it. From a single-contributor tools/zk/cmd/ceremony
      # run (2026-10-08, drand beacons); the web client's proving_key.raw.bin
      # (sha256 71177142...4ea3c) is its pair. Not for mainnet.
