            denom: usparz.sparkdreamdev
        voting_period: "3600s"            # 1 hour (DEVNET; production: 432000s = 5d)
        expedited_min_deposit:
          - amount: "250000000"           # 250 SPARK = 5x min_deposit, the SDK's
                                          # DefaultMinExpeditedDepositTokensRatio. The chain
                                          # launcher derives this field as min_deposit x 5 and
                                          # cannot express any other ratio, so a launched chain
                                          # always lands here; matching it keeps the committed
                                          # genesis equal to what a reset actually deploys.
            denom: usparz.sparkdreamdev
        expedited_voting_period: "1800s"  # 30 minutes (DEVNET; production: 86400s = 1d)
