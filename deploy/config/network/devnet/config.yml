    bank:
      # Devnet's per-chain token identity is SPARZ / DRMZ rather than SPARK /
      # DREAM, so a devnet voucher is unmistakable in an IBC denom-trace or an
      # explorer. x/identity re-registers this metadata from its own genesis
      # block at InitGenesis (with the uppercase symbol); these entries exist so
      # `ignite chain init` alone still produces a usable genesis.
      denom_metadata:
      - base: usparz.sparkdreamdev
        denom_units:
        - denom: usparz.sparkdreamdev
          exponent: 0
        - denom: sparz
          exponent: 6
        description: Native token of Spark Dream A T E L I E R.
        display: sparz
        name: sparz
        symbol: sparz
      - base: udrmz.sparkdreamdev
        denom_units:
        - denom: udrmz.sparkdreamdev
          exponent: 0
        - denom: drmz
          exponent: 6
        description: Internal coordination token - earned through contribution, not traded.
        display: drmz
        name: drmz
        symbol: drmz
    commons:
