    forum:
      params:
        # Archive timing - FAST for testing
        archive_threshold: "5"       # 5 seconds (was 30 days = 2592000)
        unarchive_cooldown: "5"      # 5 seconds (was 1 day = 86400)
        archive_cooldown: "5"        # 5 seconds (was 30 days = 2592000)
        ephemeral_ttl: "15"          # 15 seconds (was 24h = 86400) for pruning tests
        hide_appeal_cooldown: "5"    # 5 seconds (was 1 hour = 3600)
        lock_appeal_cooldown: "5"    # 5 seconds (was 1 hour = 3600)
        move_appeal_cooldown: "5"    # 5 seconds (was 1 hour = 3600)
        # Per-UTC-day post cap - RAISED for testing (production default 50).
        # The forum e2e suite runs ~20 test files sequentially against one chain
        # in a single UTC day, and poster1 alone authors well over 50 posts
        # cumulatively. At the default 50 the cap is exhausted mid-suite
        # (advanced_test), cascading rate-limit (code 1500) failures into
        # anon_test and content_status_test whose prerequisite posts then fail
        # to create. No script asserts the 50 cap, so raise it far above the
        # suite's cumulative volume.
        daily_post_limit: "1000"
    collect:
      params:
        # Curator age gate - SHORT for testing (production: 14400 ~1 day).
        # Needs to be low enough to exercise the rate-collection tag-validation
        # path in e2e tests, yet high enough that curation_test.sh's "curator
        # too new" rejection still fires for a curator rating on the same
        # block they registered (currentBlock - registeredAt = 0-1).
        min_curator_age_blocks: "5"
        # Hide-expiry window - SHORT for testing (production: 100800 ~7 days).
        # endorsement_slash_test.sh waits an unappealed hide out to verify
        # deleteCollectionFull burns the endorser's DREAM stake (instead of
        # refunding it, the pre-fix loophole). At ~1s/block this is ~40s — long
        # enough that Test 2's HIDDEN collection survives the owner's rejected
        # delete + status/lock assertions (~15s of tx pacing), and that Test 3's
        # MsgAppealHide (filed ~44 blocks in) lands before the unappealed-hide
        # auto-expiry fires, yet short enough that Test 1's 75s wait covers it.
        hide_expiry_blocks: "40"
        # Appeal-cooldown window - SHORT for testing (production: 600 ~1 hour).
        # The appeal-deferral subtest needs the owner to file an appeal within
        # a couple of blocks of the sentinel hide.
        appeal_cooldown_blocks: "2"
        # Appeal-deadline window - SHORT for testing (production: 201600
        # ~14 days). The appeal-deferral subtest waits for an unresolved
        # appeal to time out via §10.3a (handleAppealedHideExpiry) so the
        # collection's status restores to ACTIVE and the §10.1 deferral
        # finally drops. At ~1s/block this is ~60s — wide enough that the
        # deferral assertion (~30s after the appeal) lands while the appeal is
        # still in flight, then the subsequent 75s wait outlasts the deadline so
        # the timeout-restore + delete completes.
        appeal_deadline_blocks: "60"
        # Sentinel self-correct window - SHORT for testing (production: 14400
        # ~24 hours). MUST stay below hide_expiry_blocks (=40 here) or Params
        # validation rejects genesis. sentinel_unhide_test.sh unhides right
        # after a hide (needs only a few blocks of window) and separately
        # asserts the expired-window rejection after ~20 blocks.
        sentinel_unhide_window_blocks: "20"
    name:
      params:
        # Bumped from 5 → 10 for E2E. Alice now auto-claims `alice` at
        # genesis (GenesisHandles) and the suite registers up to 6 names for
