syntax = "proto3";

package sparkdream.federation.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "sparkdream/federation/v1/params.proto";
import "sparkdream/federation/v1/types.proto";

option go_package = "sparkdream/x/federation/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc RegisterPeer(MsgRegisterPeer) returns (MsgRegisterPeerResponse);
  rpc RemovePeer(MsgRemovePeer) returns (MsgRemovePeerResponse);
  rpc SuspendPeer(MsgSuspendPeer) returns (MsgSuspendPeerResponse);
  rpc ResumePeer(MsgResumePeer) returns (MsgResumePeerResponse);
  rpc UpdatePeerPolicy(MsgUpdatePeerPolicy) returns (MsgUpdatePeerPolicyResponse);
  rpc RegisterBridge(MsgRegisterBridge) returns (MsgRegisterBridgeResponse);
  rpc UpdateBridge(MsgUpdateBridge) returns (MsgUpdateBridgeResponse);
  // RevokeBridge, SlashBridge, UnbondBridge, TopUpBridgeStake were removed
  // in Phase 4 of the federation→service migration:
  //   - slashing  → x/service MsgReportOperator → MsgResolveReport
  //   - unbond    → x/service MsgUnbondOperator (operator-signed directly)
  //   - top-up    → x/service MsgTopUpBond (operator-signed directly)
  //   - revoke    → covered by AfterOperatorDissolved hook via T1_SLASH
  //                 with dissolve=true
  rpc SubmitFederatedContent(MsgSubmitFederatedContent) returns (MsgSubmitFederatedContentResponse);
  rpc FederateContent(MsgFederateContent) returns (MsgFederateContentResponse);
  rpc AttestOutbound(MsgAttestOutbound) returns (MsgAttestOutboundResponse);
  rpc ModerateContent(MsgModerateContent) returns (MsgModerateContentResponse);
  rpc LinkIdentity(MsgLinkIdentity) returns (MsgLinkIdentityResponse);
  rpc UnlinkIdentity(MsgUnlinkIdentity) returns (MsgUnlinkIdentityResponse);
  rpc ConfirmIdentityLink(MsgConfirmIdentityLink) returns (MsgConfirmIdentityLinkResponse);
  rpc RequestReputationAttestation(MsgRequestReputationAttestation) returns (MsgRequestReputationAttestationResponse);
  // NOTE: Phase 4 of the bonded-role generalization removed BondVerifier /
  // UnbondVerifier RPCs. Verifier bonding now flows through x/rep's generic
  // MsgBondRole / MsgUnbondRole with role_type=ROLE_TYPE_FEDERATION_VERIFIER.
  rpc VerifyContent(MsgVerifyContent) returns (MsgVerifyContentResponse);
  rpc ChallengeVerification(MsgChallengeVerification) returns (MsgChallengeVerificationResponse);
  rpc SubmitArbiterHash(MsgSubmitArbiterHash) returns (MsgSubmitArbiterHashResponse);
  rpc EscalateChallenge(MsgEscalateChallenge) returns (MsgEscalateChallengeResponse);
  rpc UpdateOperationalParams(MsgUpdateOperationalParams) returns (MsgUpdateOperationalParamsResponse);
  rpc UpdatePeerController(MsgUpdatePeerController) returns (MsgUpdatePeerControllerResponse);
  rpc ResyncBridgeCount(MsgResyncBridgeCount) returns (MsgResyncBridgeCountResponse);
  rpc PruneOrphanBindings(MsgPruneOrphanBindings) returns (MsgPruneOrphanBindingsResponse);
}

// --- Governance ---

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgUpdateParams";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
message MsgUpdateParamsResponse {}

// --- Peer Lifecycle (Commons Council) ---

message MsgRegisterPeer {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgRegisterPeer";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string display_name = 3;
  PeerType type = 4;
  string ibc_channel_id = 5;
  string metadata = 6;
  // controller_group is the x/commons Group policy address that will
  // resolve tier-1 reports against this peer's bridge operators
  // (federation→service migration, Decision 2). Optional — if empty,
  // federation defaults to the Operations Committee at bridge-
  // registration time. If non-empty, the address MUST be a valid
  // registered group policy (validated via commonsKeeper.IsGroupPolicyAddress).
  string controller_group = 7 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgRegisterPeerResponse {}

message MsgRemovePeer {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgRemovePeer";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string reason = 3;
}
message MsgRemovePeerResponse {}

message MsgSuspendPeer {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgSuspendPeer";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string reason = 3;
}
message MsgSuspendPeerResponse {}

message MsgResumePeer {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgResumePeer";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
}
message MsgResumePeerResponse {}

// --- Peer Policy (Operations Committee) ---

message MsgUpdatePeerPolicy {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgUpdatePeerPolicy";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  PeerPolicy policy = 3 [(gogoproto.nullable) = false];
}
message MsgUpdatePeerPolicyResponse {}

// --- Bridge Operators (Operations Committee) ---

// MsgRegisterBridge registers a bridge operator for a peer. Operator-
// signed (federation→service migration): the operator pays their own
// bond into x/service, so they must sign the tx. Peer existence and
// per-peer cap are federation-side gates; bond amount, slash caps,
// unbonding period live on x/service ServiceTypeConfig per service_type.
message MsgRegisterBridge {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "sparkdream/x/federation/MsgRegisterBridge";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string protocol = 3;
  string endpoint = 4;
  // stake is the SPARK the operator escrows as their service.Operator
  // bond. Must be ≥ ServiceTypeConfig.min_bond for the protocol's
  // service_type. If the operator already has a live service.Operator
  // under the same service_type (re-registering for a different peer
  // per Decision 1a), this amount is added on top via TopUpBond.
  cosmos.base.v1beta1.Coin stake = 5 [(gogoproto.nullable) = false];
}
message MsgRegisterBridgeResponse {}

message MsgUpdateBridge {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgUpdateBridge";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string operator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 3;
  string endpoint = 4;
}
message MsgUpdateBridgeResponse {}

// (Bridge self-service messages — UnbondBridge, TopUpBridgeStake —
// were removed in Phase 4. Operators call x/service MsgUnbondOperator
// and MsgTopUpBond directly. See migration plan.)

// --- Content Federation ---

message MsgSubmitFederatedContent {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "sparkdream/x/federation/MsgSubmitFederatedContent";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string remote_content_id = 3;
  string content_type = 4;
  string creator_identity = 5;
  string creator_name = 6;
  string title = 7;
  string body = 8;
  string content_uri = 9;
  bytes protocol_metadata = 10;
  int64 remote_created_at = 11;
  bytes content_hash = 12;
}
message MsgSubmitFederatedContentResponse {
  uint64 content_id = 1;
}

message MsgFederateContent {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgFederateContent";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string content_type = 3;
  string local_content_id = 4;
  string title = 5;
  string body = 6;
  string content_uri = 7;
  bytes content_hash = 8;
}
message MsgFederateContentResponse {}

message MsgAttestOutbound {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "sparkdream/x/federation/MsgAttestOutbound";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string content_type = 3;
  string local_content_id = 4;
}
message MsgAttestOutboundResponse {}

message MsgModerateContent {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgModerateContent";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 content_id = 2;
  FederatedContentStatus new_status = 3;
  string reason = 4;
}
message MsgModerateContentResponse {}

// --- Identity Linking ---

message MsgLinkIdentity {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgLinkIdentity";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string remote_identity = 3;
}
message MsgLinkIdentityResponse {}

message MsgUnlinkIdentity {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgUnlinkIdentity";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
}
message MsgUnlinkIdentityResponse {}

message MsgConfirmIdentityLink {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgConfirmIdentityLink";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string claimant_chain_peer_id = 2;
}
message MsgConfirmIdentityLinkResponse {}

// --- Reputation ---

message MsgRequestReputationAttestation {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgRequestReputationAttestation";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string remote_address = 3;
}
message MsgRequestReputationAttestationResponse {}

// --- Verifier (bonding moved to x/rep MsgBondRole / MsgUnbondRole) ---

message MsgVerifyContent {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgVerifyContent";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 content_id = 2;
  bytes content_hash = 3;
}
message MsgVerifyContentResponse {}

// --- Challenge ---

message MsgChallengeVerification {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgChallengeVerification";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 content_id = 2;
  bytes content_hash = 3;
  string evidence = 4;
}
message MsgChallengeVerificationResponse {}

message MsgSubmitArbiterHash {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgSubmitArbiterHash";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 content_id = 2;
  bytes content_hash = 3;
}
message MsgSubmitArbiterHashResponse {}

message MsgEscalateChallenge {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/federation/MsgEscalateChallenge";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 content_id = 2;
}
message MsgEscalateChallengeResponse {}

// --- Operational Params (Operations Committee) ---

message MsgUpdateOperationalParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgUpdateOperationalParams";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  FederationOperationalParams operational_params = 2 [(gogoproto.nullable) = false];
}
message MsgUpdateOperationalParamsResponse {}

// --- Peer Controller (federation→service migration, Phase 1) ---

// MsgUpdatePeerController is a gov-authority message that changes the
// controller_group on an existing peer. Affects only new bridge
// registrations under that peer — existing bridges keep the controller
// captured on their service.Operator at registration time. Transferring
// existing bridges requires service.MsgOpenControllerTransferCase.
message MsgUpdatePeerController {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgUpdatePeerController";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
  string controller_group = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message MsgUpdatePeerControllerResponse {}

// --- Invariant recovery (federation→service migration, Phase 1) ---

// MsgResyncBridgeCount is a dual-authority message (Operations Committee
// OR gov) that re-counts BridgesByPeer for the given peer and overwrites
// the peer's bridges_count counter. Recovery path when the count
// invariant triggers without needing a chain upgrade — pure cleanup,
// can't be abused to mutate operator state.
message MsgResyncBridgeCount {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgResyncBridgeCount";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
}
message MsgResyncBridgeCountResponse {
  uint64 new_count = 1;
}

// MsgPruneOrphanBindings is a dual-authority message (Operations
// Committee OR gov) that runs the AfterOperatorDissolved/Retired
// cleanup logic for any BridgeBinding whose referenced service.Operator
// is in a terminal state (SLASHED/RETIRED/missing). Recovery path when
// the fail-soft hook pattern swallowed a panic and left an orphan.
// Pure cleanup, no value mutation.
message MsgPruneOrphanBindings {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/federation/MsgPruneOrphanBindings";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string peer_id = 2;
}
message MsgPruneOrphanBindingsResponse {
  uint64 pruned = 1;
}
