syntax = "proto3";

package sparkdream.artifact.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "sparkdream/artifact/v1/params.proto";
import "sparkdream/artifact/v1/types.proto";

option go_package = "sparkdream/x/artifact/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/params";
  }

  // Class returns one class.
  rpc Class(QueryClassRequest) returns (QueryClassResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/class/{class_id}";
  }

  // Classes lists all classes.
  rpc Classes(QueryClassesRequest) returns (QueryClassesResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/classes";
  }

  // ClassesByOwner lists the classes an address owns.
  rpc ClassesByOwner(QueryClassesByOwnerRequest) returns (QueryClassesByOwnerResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/classes_by_owner/{owner}";
  }

  // Token returns one token.
  rpc Token(QueryTokenRequest) returns (QueryTokenResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/token/{class_id}/{token_id}";
  }

  // Tokens lists the tokens of a class.
  rpc Tokens(QueryTokensRequest) returns (QueryTokensResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/tokens/{class_id}";
  }

  // TokensByOwner lists the tokens an address owns.
  rpc TokensByOwner(QueryTokensByOwnerRequest) returns (QueryTokensByOwnerResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/tokens_by_owner/{owner}";
  }

  // Owner returns a token's owner.
  rpc Owner(QueryOwnerRequest) returns (QueryOwnerResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/owner/{class_id}/{token_id}";
  }

  // Supply returns a class's supply counters.
  rpc Supply(QuerySupplyRequest) returns (QuerySupplyResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/supply/{class_id}";
  }

  // Listing returns a token's active listing.
  rpc Listing(QueryListingRequest) returns (QueryListingResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/listing/{class_id}/{token_id}";
  }

  // Listings lists active listings, optionally for one class.
  rpc Listings(QueryListingsRequest) returns (QueryListingsResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/listings";
  }

  // ListingsBySeller lists a seller's active listings.
  rpc ListingsBySeller(QueryListingsBySellerRequest) returns (QueryListingsBySellerResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/listings_by_seller/{seller}";
  }

  // Inbox lists an address's open incoming items.
  rpc Inbox(QueryInboxRequest) returns (QueryInboxResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/inbox/{address}";
  }

  // Outbox lists an address's open outgoing items.
  rpc Outbox(QueryOutboxRequest) returns (QueryOutboxResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/outbox/{address}";
  }

  // ReceivePolicy returns an address's effective receive policy.
  rpc ReceivePolicy(QueryReceivePolicyRequest) returns (QueryReceivePolicyResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/receive_policy/{address}";
  }

  // PendingClassOwner returns a class's open handover proposal.
  rpc PendingClassOwner(QueryPendingClassOwnerRequest) returns (QueryPendingClassOwnerResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/pending_class_owner/{class_id}";
  }

  // HideRecord returns one hide record.
  rpc HideRecord(QueryHideRecordRequest) returns (QueryHideRecordResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/hide_record/{hide_id}";
  }

  // HideRecordsByTarget lists every hide record for a class (token_id 0) or token.
  rpc HideRecordsByTarget(QueryHideRecordsByTargetRequest) returns (QueryHideRecordsByTargetResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/hide_records_by_target/{class_id}/{token_id}";
  }

  // MediaProposals lists the open media proposals of a token.
  rpc MediaProposals(QueryMediaProposalsRequest) returns (QueryMediaProposalsResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/media_proposals/{class_id}/{token_id}";
  }

  // PublicMintQuote prices a public mint.
  rpc PublicMintQuote(QueryPublicMintQuoteRequest) returns (QueryPublicMintQuoteResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/public_mint_quote/{class_id}/{buyer}/{quantity}";
  }

  // Edition shows one edition of an EDITIONS class.
  rpc Edition(QueryEditionRequest) returns (QueryEditionResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/edition/{class_id}/{edition_id}";
  }

  // Editions lists the editions of a class.
  rpc Editions(QueryEditionsRequest) returns (QueryEditionsResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/editions/{class_id}";
  }

  // Balance shows one address's units of an edition and its claimable
  // retro funding.
  rpc Balance(QueryBalanceRequest) returns (QueryBalanceResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/balance/{class_id}/{edition_id}/{owner}";
  }

  // BalancesByOwner lists every edition balance an address holds.
  rpc BalancesByOwner(QueryBalancesByOwnerRequest) returns (QueryBalancesByOwnerResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/balances_by_owner/{owner}";
  }

  // EditionHolders lists the balances of one edition.
  rpc EditionHolders(QueryEditionHoldersRequest) returns (QueryEditionHoldersResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/edition_holders/{class_id}/{edition_id}";
  }

  // UnitListing shows one unit listing.
  rpc UnitListing(QueryUnitListingRequest) returns (QueryUnitListingResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/unit_listing/{listing_id}";
  }

  // UnitListings lists the active unit listings of an edition.
  rpc UnitListings(QueryUnitListingsRequest) returns (QueryUnitListingsResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/unit_listings/{class_id}/{edition_id}";
  }

  // CraftRecipes lists a class's crafting recipes.
  rpc CraftRecipes(QueryCraftRecipesRequest) returns (QueryCraftRecipesResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/craft_recipes/{class_id}";
  }

  // Rental shows a token's active rental.
  rpc Rental(QueryRentalRequest) returns (QueryRentalResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/rental/{class_id}/{token_id}";
  }

  // RentalOffer shows a token's open rental offer.
  rpc RentalOffer(QueryRentalOfferRequest) returns (QueryRentalOfferResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/rental_offer/{class_id}/{token_id}";
  }

  // RentalsByUser lists the active rentals an address holds as renter.
  rpc RentalsByUser(QueryRentalsByUserRequest) returns (QueryRentalsByUserResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/rentals_by_user/{user}";
  }

  // Children lists the tokens nested directly in a token, with the
  // contents hash MsgBuy and MsgAcceptRental pin.
  rpc Children(QueryChildrenRequest) returns (QueryChildrenResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/children/{class_id}/{token_id}";
  }

  // HarbergerQuote shows a Harberger token's current price and tax.
  rpc HarbergerQuote(QueryHarbergerQuoteRequest) returns (QueryHarbergerQuoteResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/harberger_quote/{class_id}/{token_id}";
  }

  // Offer shows one escrowed offer.
  rpc Offer(QueryOfferRequest) returns (QueryOfferResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/offer/{offer_id}";
  }

  // Offers lists the open offers on a token (token_id 0 = collection offers).
  rpc Offers(QueryOffersRequest) returns (QueryOffersResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/offers/{class_id}/{token_id}";
  }

  // OffersByBidder lists an address's open offers.
  rpc OffersByBidder(QueryOffersByBidderRequest) returns (QueryOffersByBidderResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/offers_by_bidder/{bidder}";
  }

  // Auction shows one auction and the lowest bid it accepts now.
  rpc Auction(QueryAuctionRequest) returns (QueryAuctionResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/auction/{auction_id}";
  }

  // Auctions lists open auctions (class_id 0 = every class).
  rpc Auctions(QueryAuctionsRequest) returns (QueryAuctionsResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/auctions/{class_id}";
  }

  // AuctionsBySeller lists the open auctions started by seller (and the
  // seller's predecessor addresses).
  rpc AuctionsBySeller(QueryAuctionsBySellerRequest) returns (QueryAuctionsBySellerResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/auctions_by_seller/{seller}";
  }

  // RentalOffers lists unexpired rental offers. With user set, only the
  // offers addressed to that user (or a predecessor address); otherwise every
  // offer, including the open ones anyone may accept.
  rpc RentalOffers(QueryRentalOffersRequest) returns (QueryRentalOffersResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/rental_offers";
  }

  // NextClassId returns the id the next created class will get. Clients that
  // bind the id into data before creating (blind-mint commitments) pass it as
  // MsgCreateClass.expected_class_id.
  rpc NextClassId(QueryNextClassIdRequest) returns (QueryNextClassIdResponse) {
    option (google.api.http).get = "/sparkdream/artifact/v1/next_class_id";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// ClassView is a class as served to clients. When withheld is true the
// content fields have been blanked because the class is hidden.
message ClassView {
  Class class = 1 [(gogoproto.nullable) = false];
  bool withheld = 2;
}

// TokenView is a token as served to clients. When withheld is true the
// metadata has been blanked because the token or its class is hidden.
message TokenView {
  Token token = 1 [(gogoproto.nullable) = false];
  bool withheld = 2;
  string metadata_hash = 3;
  ContentStatus class_status = 4;

  // What clients should show: the holder's displayed media version, the
  // renderer output, the schedule stage in effect, or the stored metadata.
  // Blank when withheld.
  TokenMetadata displayed_metadata = 5 [(gogoproto.nullable) = false];

  // "stored" | "schedule" | "media_version" | "renderer" | "unrevealed".
  string display_source = 6;

  // Why a renderer fell back to stored metadata, when it did.
  string render_error = 7;

  // true when expires_at has passed.
  bool expired = 8;

  // GENERATIVE_SEED classes: the token seed (lowercase hex) once the class
  // seed is revealed.
  string seed = 9;

  // Single-token query, for a token holding nested tokens: the hash
  // MsgBuy, MsgAcceptRental, offers and bids pin.
  string contents_hash = 10;

  // Single-token query, while rented: the renter.
  string user = 11;

  // Single-token query, Harberger tokens: what MsgForceBuy pays now.
  string harberger_price = 12;
}

// InboxItem is one open pending transfer or pending mint.
message InboxItem {
  InboxKind kind = 1;
  uint64 class_id = 2;
  uint64 token_id = 3;

  // Transfer sender, or minter.
  string from = 4;
  string to = 5;
  int64 created_at = 6;
  int64 expires_at = 7;

  // Metadata the recipient will receive (blanked when withheld).
  TokenMetadata metadata = 8 [(gogoproto.nullable) = false];
  string metadata_hash = 9;
  bool withheld = 10;

  // Unit items (kind UNIT_*): class_id is 0 and token_id the pending id,
  // which is the ref to accept, reject or cancel; these name the edition.
  uint64 unit_class_id = 11;
  uint64 edition_id = 12;
  uint64 amount = 13;
}

// QueryClassRequest defines the QueryClassRequest message.
message QueryClassRequest {
  uint64 class_id = 1;
}

// QueryClassResponse defines the QueryClassResponse message.
message QueryClassResponse {
  ClassView class = 1 [(gogoproto.nullable) = false];
}

// QueryClassesRequest defines the QueryClassesRequest message.
message QueryClassesRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryClassesResponse defines the QueryClassesResponse message.
message QueryClassesResponse {
  repeated ClassView classes = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryClassesByOwnerRequest defines the QueryClassesByOwnerRequest message.
message QueryClassesByOwnerRequest {
  string owner = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryClassesByOwnerResponse defines the QueryClassesByOwnerResponse message.
message QueryClassesByOwnerResponse {
  repeated ClassView classes = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryTokenRequest defines the QueryTokenRequest message.
message QueryTokenRequest {
  uint64 class_id = 1;
  uint64 token_id = 2;
}

// QueryTokenResponse defines the QueryTokenResponse message.
message QueryTokenResponse {
  TokenView token = 1 [(gogoproto.nullable) = false];

  // Set when the token is listed.
  Listing listing = 2;

  // Set while the token is up for auction.
  Auction auction = 3;
}

// QueryTokensRequest defines the QueryTokensRequest message.
message QueryTokensRequest {
  uint64 class_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryTokensResponse defines the QueryTokensResponse message.
message QueryTokensResponse {
  repeated TokenView tokens = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryTokensByOwnerRequest defines the QueryTokensByOwnerRequest message.
message QueryTokensByOwnerRequest {
  string owner = 1;

  // Optional class filter (0 = all classes).
  uint64 class_id = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

// QueryTokensByOwnerResponse defines the QueryTokensByOwnerResponse message.
message QueryTokensByOwnerResponse {
  repeated TokenView tokens = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryOwnerRequest defines the QueryOwnerRequest message.
message QueryOwnerRequest {
  uint64 class_id = 1;
  uint64 token_id = 2;
}

// QueryOwnerResponse defines the QueryOwnerResponse message.
message QueryOwnerResponse {
  string owner = 1;
}

// QuerySupplyRequest defines the QuerySupplyRequest message.
message QuerySupplyRequest {
  uint64 class_id = 1;
}

// QuerySupplyResponse defines the QuerySupplyResponse message.
message QuerySupplyResponse {
  uint64 supply = 1;
  uint64 burned = 2;
  uint64 reserved_supply = 3;
  uint64 max_supply = 4;
  bool minting_closed = 5;
}

// QueryListingRequest defines the QueryListingRequest message.
message QueryListingRequest {
  uint64 class_id = 1;
  uint64 token_id = 2;
}

// QueryListingResponse defines the QueryListingResponse message.
message QueryListingResponse {
  Listing listing = 1 [(gogoproto.nullable) = false];
}

// QueryListingsRequest defines the QueryListingsRequest message.
message QueryListingsRequest {
  // Optional class filter (0 = all classes).
  uint64 class_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryListingsResponse defines the QueryListingsResponse message.
message QueryListingsResponse {
  repeated Listing listings = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryListingsBySellerRequest defines the QueryListingsBySellerRequest message.
message QueryListingsBySellerRequest {
  string seller = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryListingsBySellerResponse defines the QueryListingsBySellerResponse message.
message QueryListingsBySellerResponse {
  repeated Listing listings = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryInboxRequest defines the QueryInboxRequest message.
message QueryInboxRequest {
  string address = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryInboxResponse defines the QueryInboxResponse message.
message QueryInboxResponse {
  repeated InboxItem items = 1 [(gogoproto.nullable) = false];
  uint32 inbox_count = 2;
  cosmos.base.query.v1beta1.PageResponse pagination = 3;
}

// QueryOutboxRequest defines the QueryOutboxRequest message.
message QueryOutboxRequest {
  string address = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryOutboxResponse defines the QueryOutboxResponse message.
message QueryOutboxResponse {
  repeated InboxItem items = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryReceivePolicyRequest defines the QueryReceivePolicyRequest message.
message QueryReceivePolicyRequest {
  string address = 1;
}

// QueryReceivePolicyResponse defines the QueryReceivePolicyResponse message.
message QueryReceivePolicyResponse {
  ReceivePolicy policy = 1;
  bool is_default = 2;
}

// QueryPendingClassOwnerRequest defines the QueryPendingClassOwnerRequest message.
message QueryPendingClassOwnerRequest {
  uint64 class_id = 1;
}

// QueryPendingClassOwnerResponse defines the QueryPendingClassOwnerResponse message.
message QueryPendingClassOwnerResponse {
  PendingClassOwner pending = 1 [(gogoproto.nullable) = false];
}

// QueryHideRecordRequest defines the QueryHideRecordRequest message.
message QueryHideRecordRequest {
  uint64 hide_id = 1;
}

// QueryHideRecordResponse defines the QueryHideRecordResponse message.
message QueryHideRecordResponse {
  HideRecord record = 1 [(gogoproto.nullable) = false];
}

// QueryHideRecordsByTargetRequest defines the QueryHideRecordsByTargetRequest message.
message QueryHideRecordsByTargetRequest {
  uint64 class_id = 1;

  // 0 = the class itself.
  uint64 token_id = 2;
}

// QueryHideRecordsByTargetResponse defines the QueryHideRecordsByTargetResponse message.
message QueryHideRecordsByTargetResponse {
  repeated HideRecord records = 1 [(gogoproto.nullable) = false];
}

// QueryPublicMintQuoteRequest defines the QueryPublicMintQuoteRequest message.
message QueryPublicMintQuoteRequest {
  uint64 class_id = 1;
  string buyer = 2;
  uint32 quantity = 3;
}

// QueryPublicMintQuoteResponse defines the QueryPublicMintQuoteResponse message.
message QueryPublicMintQuoteResponse {
  // quantity x price
  cosmos.base.v1beta1.Coin total_price = 1 [(gogoproto.nullable) = false];

  // Part of total_price routed to the community pool.
  cosmos.base.v1beta1.Coin fee = 2 [(gogoproto.nullable) = false];

  // quantity x token_deposit (refundable).
  cosmos.base.v1beta1.Coin deposit = 3 [(gogoproto.nullable) = false];

  // Remaining per-address allowance; -1 = unlimited.
  int64 remaining_allowance = 4;

  // true when a public mint of this quantity would currently succeed.
  bool available = 5;

  // Why not, when available is false.
  string reason = 6;

  // Price of the first token in this quote under the class price curve.
  cosmos.base.v1beta1.Coin unit_price = 7 [(gogoproto.nullable) = false];

  // Price of the most expensive token in this quote (what max_price must cover).
  cosmos.base.v1beta1.Coin max_unit_price = 8 [(gogoproto.nullable) = false];
}

// QueryMediaProposalsRequest defines the QueryMediaProposalsRequest message.
message QueryMediaProposalsRequest {
  uint64 class_id = 1;
  uint64 token_id = 2;
}

// QueryMediaProposalsResponse defines the QueryMediaProposalsResponse message.
message QueryMediaProposalsResponse {
  repeated MediaProposal proposals = 1 [(gogoproto.nullable) = false];
}

// EditionView is an edition as served to clients. When withheld is true the
// metadata and claim scope are blanked because the edition or its class is
// hidden.
message EditionView {
  Edition edition = 1 [(gogoproto.nullable) = false];
  bool withheld = 2;
  string metadata_hash = 3;
  ContentStatus class_status = 4;
}

// BalanceView is a balance with what its holder could claim now.
message BalanceView {
  Balance balance = 1 [(gogoproto.nullable) = false];

  // unclaimed plus rewards accrued since the last settlement.
  string claimable = 2;
}

// QueryEditionRequest defines the QueryEditionRequest message.
message QueryEditionRequest {
  uint64 class_id = 1;
  uint64 edition_id = 2;
}

// QueryEditionResponse defines the QueryEditionResponse message.
message QueryEditionResponse {
  EditionView edition = 1 [(gogoproto.nullable) = false];
}

// QueryEditionsRequest defines the QueryEditionsRequest message.
message QueryEditionsRequest {
  uint64 class_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryEditionsResponse defines the QueryEditionsResponse message.
message QueryEditionsResponse {
  repeated EditionView editions = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryBalanceRequest defines the QueryBalanceRequest message.
message QueryBalanceRequest {
  uint64 class_id = 1;
  uint64 edition_id = 2;
  string owner = 3;
}

// QueryBalanceResponse defines the QueryBalanceResponse message.
message QueryBalanceResponse {
  BalanceView balance = 1 [(gogoproto.nullable) = false];
}

// QueryBalancesByOwnerRequest defines the QueryBalancesByOwnerRequest message.
message QueryBalancesByOwnerRequest {
  string owner = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryBalancesByOwnerResponse defines the QueryBalancesByOwnerResponse message.
message QueryBalancesByOwnerResponse {
  repeated BalanceView balances = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryEditionHoldersRequest defines the QueryEditionHoldersRequest message.
message QueryEditionHoldersRequest {
  uint64 class_id = 1;
  uint64 edition_id = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

// QueryEditionHoldersResponse defines the QueryEditionHoldersResponse message.
message QueryEditionHoldersResponse {
  repeated BalanceView balances = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryUnitListingRequest defines the QueryUnitListingRequest message.
message QueryUnitListingRequest {
  uint64 listing_id = 1;
}

// QueryUnitListingResponse defines the QueryUnitListingResponse message.
message QueryUnitListingResponse {
  UnitListing listing = 1 [(gogoproto.nullable) = false];
}

// QueryUnitListingsRequest defines the QueryUnitListingsRequest message.
message QueryUnitListingsRequest {
  uint64 class_id = 1;
  uint64 edition_id = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

// QueryUnitListingsResponse defines the QueryUnitListingsResponse message.
message QueryUnitListingsResponse {
  repeated UnitListing listings = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryCraftRecipesRequest defines the QueryCraftRecipesRequest message.
message QueryCraftRecipesRequest {
  uint64 class_id = 1;
}

// QueryCraftRecipesResponse defines the QueryCraftRecipesResponse message.
message QueryCraftRecipesResponse {
  repeated CraftRecipe recipes = 1 [(gogoproto.nullable) = false];

  // true once the class has been crafted into: recipes can then only be
  // removed.
  bool locked = 2;
}

// QueryRentalRequest defines the QueryRentalRequest message.
message QueryRentalRequest {
  uint64 class_id = 1;
  uint64 token_id = 2;
}

// QueryRentalResponse defines the QueryRentalResponse message.
message QueryRentalResponse {
  Rental rental = 1 [(gogoproto.nullable) = false];
}

// QueryRentalOfferRequest defines the QueryRentalOfferRequest message.
message QueryRentalOfferRequest {
  uint64 class_id = 1;
  uint64 token_id = 2;
}

// QueryRentalOfferResponse defines the QueryRentalOfferResponse message.
message QueryRentalOfferResponse {
  RentalOffer offer = 1 [(gogoproto.nullable) = false];
}

// QueryRentalsByUserRequest defines the QueryRentalsByUserRequest message.
message QueryRentalsByUserRequest {
  string user = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

// QueryRentalsByUserResponse defines the QueryRentalsByUserResponse message.
message QueryRentalsByUserResponse {
  repeated Rental rentals = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryChildrenRequest defines the QueryChildrenRequest message.
message QueryChildrenRequest {
  uint64 class_id = 1;
  uint64 token_id = 2;
}

// QueryChildrenResponse defines the QueryChildrenResponse message.
message QueryChildrenResponse {
  // Direct children, in key order.
  repeated TokenRef children = 1 [(gogoproto.nullable) = false];

  // Hash over the whole tree under the token ("" when it holds nothing).
  string contents_hash = 2;

  // Tokens nested under it at any depth.
  uint32 descendants = 3;
}

// QueryHarbergerQuoteRequest defines the QueryHarbergerQuoteRequest message.
message QueryHarbergerQuoteRequest {
  uint64 class_id = 1;
  uint64 token_id = 2;
}

// QueryHarbergerQuoteResponse defines the QueryHarbergerQuoteResponse message.
message QueryHarbergerQuoteResponse {
  HarbergerState state = 1 [(gogoproto.nullable) = false];

  // What MsgForceBuy would pay now (falls during foreclosure).
  string current_price = 2;

  // Tax per period on the assessed price.
  string tax_per_period = 3;
  bool foreclosed = 4;

  // false while the token cannot be bought (a zero price inside the grace
  // period, or a hidden token or class).
  bool for_sale = 5;
}

