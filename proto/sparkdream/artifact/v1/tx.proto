// token of a class (token_id 0).
message MsgMakeOffer {
  option (cosmos.msg.v1.signer) = "bidder";
  option (amino.name) = "sparkdream/x/artifact/MsgMakeOffer";
  string bidder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 class_id = 2;
  // 0 = a collection offer: any token of the class.
  uint64 token_id = 3;
  cosmos.base.v1beta1.Coin price = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Seconds the offer stays open.
  int64 duration = 5;
  // Token offers only, optional.
  string expected_metadata_hash = 6;
  // Token offers only: required when the token holds nested tokens.
  string expected_contents_hash = 7;
}

// MsgMakeOfferResponse returns the offer id.
message MsgMakeOfferResponse {
  uint64 offer_id = 1;
}

// MsgCancelOffer withdraws an offer and refunds its escrow.
message MsgCancelOffer {
  option (cosmos.msg.v1.signer) = "bidder";
  option (amino.name) = "sparkdream/x/artifact/MsgCancelOffer";
  string bidder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 offer_id = 2;
}

// MsgCancelOfferResponse is empty.
message MsgCancelOfferResponse {}

// MsgAcceptOffer sells a token the signer holds to an offer's bidder.
message MsgAcceptOffer {
  option (cosmos.msg.v1.signer) = "seller";
  option (amino.name) = "sparkdream/x/artifact/MsgAcceptOffer";
  string seller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 offer_id = 2;
  // The token sold; required for a collection offer, and must match a
  // token offer's token.
  uint64 token_id = 3;
  // Must equal the offer's price exactly.
  cosmos.base.v1beta1.Coin expected_price = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgAcceptOfferResponse reports the settlement split.
message MsgAcceptOfferResponse {
  string fee = 1;
  string royalty = 2;
  string proceeds = 3;
}

// MsgStartAuction puts a token up for an English auction.
message MsgStartAuction {
  option (cosmos.msg.v1.signer) = "seller";
  option (amino.name) = "sparkdream/x/artifact/MsgStartAuction";
  string seller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 class_id = 2;
  uint64 token_id = 3;
  cosmos.base.v1beta1.Coin reserve_price = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Basis points each bid must beat the last by; 0 = any higher bid.
  uint32 min_increment_bps = 5;
  // Seconds.
  int64 duration = 6;
}

// MsgStartAuctionResponse returns the auction id.
message MsgStartAuctionResponse {
  uint64 auction_id = 1;
}

// MsgBid places an escrowed bid; the previous high bid is refunded.
message MsgBid {
  option (cosmos.msg.v1.signer) = "bidder";
  option (amino.name) = "sparkdream/x/artifact/MsgBid";
  string bidder = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 auction_id = 2;
  cosmos.base.v1beta1.Coin amount = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // Optional; must equal the token's current metadata hash if set.
  string expected_metadata_hash = 4;
  // Required when the token holds nested tokens.
  string expected_contents_hash = 5;
}

// MsgBidResponse returns when the auction now ends.
message MsgBidResponse {
  int64 ends_at = 1;
}

// MsgSettleAuction settles an ended auction (anyone may sign).
message MsgSettleAuction {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "sparkdream/x/artifact/MsgSettleAuction";
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 auction_id = 2;
}

// MsgSettleAuctionResponse reports whether the token was sold.
message MsgSettleAuctionResponse {
  bool sold = 1;
}

// MsgCancelAuction withdraws an auction that has no bids.
message MsgCancelAuction {
  option (cosmos.msg.v1.signer) = "seller";
  option (amino.name) = "sparkdream/x/artifact/MsgCancelAuction";
  string seller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 auction_id = 2;
}

// MsgCancelAuctionResponse is empty.
message MsgCancelAuctionResponse {}
