syntax = "proto3";
package sparkdream.artifact.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "sparkdream/artifact/v1/params.proto";
import "sparkdream/artifact/v1/types.proto";

option go_package = "sparkdream/x/artifact/types";

// GenesisState defines the artifact module's genesis state. Derived indexes
// (owner indexes, inbox/outbox, counters, expiry indexes, the Children
// index, Harberger due dates, initiative certificates) are rebuilt on
// import and never exported.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint64 class_seq = 2;
  uint64 hide_seq = 3;
  repeated Class classes = 4 [(gogoproto.nullable) = false];
  repeated Token tokens = 5 [(gogoproto.nullable) = false];
  repeated PublicMintCountEntry public_mint_counts = 6 [(gogoproto.nullable) = false];
  repeated ReceivePolicyEntry receive_policies = 7 [(gogoproto.nullable) = false];
  repeated PendingTransfer pending_transfers = 8 [(gogoproto.nullable) = false];
  repeated PendingMint pending_mints = 9 [(gogoproto.nullable) = false];
  repeated Listing listings = 10 [(gogoproto.nullable) = false];
  repeated PendingClassOwner pending_class_owners = 11 [(gogoproto.nullable) = false];
  repeated HideRecord hide_records = 12 [(gogoproto.nullable) = false];
  repeated QueueCursor class_cancel_queue = 13 [(gogoproto.nullable) = false];
  repeated QueueCursor class_scrub_queue = 14 [(gogoproto.nullable) = false];
  repeated SentinelDailyHideEntry sentinel_daily_hides = 15 [(gogoproto.nullable) = false];
  repeated MediaProposal media_proposals = 16 [(gogoproto.nullable) = false];
  repeated QueueCursor class_release_queue = 17 [(gogoproto.nullable) = false];
  repeated Edition editions = 18 [(gogoproto.nullable) = false];
  repeated Balance balances = 19 [(gogoproto.nullable) = false];
  uint64 pending_unit_seq = 20;
  repeated PendingUnits pending_units = 21 [(gogoproto.nullable) = false];
  uint64 unit_listing_seq = 22;
  repeated UnitListing unit_listings = 23 [(gogoproto.nullable) = false];
  repeated CraftRecipe craft_recipes = 24 [(gogoproto.nullable) = false];
  repeated Rental rentals = 25 [(gogoproto.nullable) = false];
  repeated RentalOffer rental_offers = 26 [(gogoproto.nullable) = false];
  uint64 offer_seq = 27;
  repeated Offer offers = 28 [(gogoproto.nullable) = false];
  uint64 auction_seq = 29;
  repeated Auction auctions = 30 [(gogoproto.nullable) = false];
}
