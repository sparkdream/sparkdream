syntax = "proto3";

package sparkdream.rep.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "sparkdream/rep/v1/bonded_role.proto";
import "sparkdream/rep/v1/role_activity.proto";
import "sparkdream/rep/v1/challenge.proto";
import "sparkdream/rep/v1/content_challenge.proto";
import "sparkdream/rep/v1/gov_action_appeal.proto";
import "sparkdream/rep/v1/initiative.proto";
import "sparkdream/rep/v1/initiative_review.proto";
import "sparkdream/rep/v1/interim.proto";
import "sparkdream/rep/v1/acceptance_criteria.proto";
import "sparkdream/rep/v1/invitation.proto";
import "sparkdream/rep/v1/jury_participation.proto";
import "sparkdream/rep/v1/jury_review.proto";
import "sparkdream/rep/v1/member.proto";
import "sparkdream/rep/v1/member_report.proto";
import "sparkdream/rep/v1/member_warning.proto";
import "sparkdream/rep/v1/params.proto";
import "sparkdream/rep/v1/project.proto";
import "sparkdream/rep/v1/reserved_tag.proto";
import "sparkdream/rep/v1/review_bounty.proto";
import "sparkdream/rep/v1/stake.proto";
import "sparkdream/rep/v1/tag.proto";
import "sparkdream/rep/v1/tag_budget.proto";
import "sparkdream/rep/v1/tag_budget_award.proto";
import "sparkdream/rep/v1/tag_report.proto";

option go_package = "sparkdream/x/rep/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/params";
  }

  // ListMember Queries a list of Member items.
  rpc GetMember(QueryGetMemberRequest) returns (QueryGetMemberResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member/{address}";
  }

  // ListMember defines the ListMember RPC.
  rpc ListMember(QueryAllMemberRequest) returns (QueryAllMemberResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member";
  }

  // ListInvitation Queries a list of Invitation items.
  rpc GetInvitation(QueryGetInvitationRequest) returns (QueryGetInvitationResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/invitation/{id}";
  }

  // ListInvitation defines the ListInvitation RPC.
  rpc ListInvitation(QueryAllInvitationRequest) returns (QueryAllInvitationResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/invitation";
  }

  // ListProject Queries a list of Project items.
  rpc GetProject(QueryGetProjectRequest) returns (QueryGetProjectResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/project/{id}";
  }

  // ListProject defines the ListProject RPC.
  rpc ListProject(QueryAllProjectRequest) returns (QueryAllProjectResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/project";
  }

  // ListInitiative Queries a list of Initiative items.
  rpc GetInitiative(QueryGetInitiativeRequest) returns (QueryGetInitiativeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/initiative/{id}";
  }

  // ListInitiative defines the ListInitiative RPC.
  rpc ListInitiative(QueryAllInitiativeRequest) returns (QueryAllInitiativeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/initiative";
  }

  // ListStake Queries a list of Stake items.
  rpc GetStake(QueryGetStakeRequest) returns (QueryGetStakeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/stake/{id}";
  }

  // ListStake defines the ListStake RPC.
  rpc ListStake(QueryAllStakeRequest) returns (QueryAllStakeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/stake";
  }

  // ListChallenge Queries a list of Challenge items.
  rpc GetChallenge(QueryGetChallengeRequest) returns (QueryGetChallengeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/challenge/{id}";
  }

  // ListChallenge defines the ListChallenge RPC.
  rpc ListChallenge(QueryAllChallengeRequest) returns (QueryAllChallengeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/challenge";
  }

  // ListJuryReview Queries a list of JuryReview items.
  rpc GetJuryReview(QueryGetJuryReviewRequest) returns (QueryGetJuryReviewResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/jury_review/{id}";
  }

  // ListJuryReview defines the ListJuryReview RPC.
  rpc ListJuryReview(QueryAllJuryReviewRequest) returns (QueryAllJuryReviewResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/jury_review";
  }

  // JuryReviewsByJuror lists the reviews a juror has been seated on. This is
  // how a juror (or their monitoring client) discovers an outstanding summons:
  // jury duty pays but is infrequent, and there is no other way to ask "am I
  // seated" short of paging through every review ever created.
  rpc JuryReviewsByJuror(QueryJuryReviewsByJurorRequest) returns (QueryJuryReviewsByJurorResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/jury_reviews_by_juror/{juror}";
  }

  // RoleActivity returns a bonded role holder's shared accountability record —
  // per-kind action counters, verdict streaks, overturn cooldown and the
  // accuracy ring. x/forum projects the sentinel view of this; reviewers and
  // curators had no way to inspect theirs at all, which matters because the
  // record gates pay and drives demotion.
  rpc RoleActivity(QueryRoleActivityRequest) returns (QueryRoleActivityResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/role_activity/{role_type}/{address}";
  }

  // ListInterim Queries a list of Interim items.
  rpc GetInterim(QueryGetInterimRequest) returns (QueryGetInterimResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/interim/{id}";
  }

  // ListInterim defines the ListInterim RPC.
  rpc ListInterim(QueryAllInterimRequest) returns (QueryAllInterimResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/interim";
  }


  // MembersByTrustLevel Queries a list of MembersByTrustLevel items.
  rpc MembersByTrustLevel(QueryMembersByTrustLevelRequest) returns (QueryMembersByTrustLevelResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/members_by_trust_level/{trust_level}";
  }

  // InvitationsByInviter Queries a list of InvitationsByInviter items.
  rpc InvitationsByInviter(QueryInvitationsByInviterRequest) returns (QueryInvitationsByInviterResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/invitations_by_inviter/{inviter}";
  }

  // InterimsByAssignee Queries a list of InterimsByAssignee items.
  rpc InterimsByAssignee(QueryInterimsByAssigneeRequest) returns (QueryInterimsByAssigneeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/interims_by_assignee/{assignee}";
  }

  // InterimsByType Queries a list of InterimsByType items.
  rpc InterimsByType(QueryInterimsByTypeRequest) returns (QueryInterimsByTypeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/interims_by_type/{interim_type}";
  }

  // InterimsByReference Queries a list of InterimsByReference items.
  rpc InterimsByReference(QueryInterimsByReferenceRequest) returns (QueryInterimsByReferenceResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/interims_by_reference/{reference_type}/{reference_id}";
  }

  // ProjectsByCouncil Queries a list of ProjectsByCouncil items.
  rpc ProjectsByCouncil(QueryProjectsByCouncilRequest) returns (QueryProjectsByCouncilResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/projects_by_council/{council}";
  }

  // InitiativesByProject Queries a list of InitiativesByProject items.
  rpc InitiativesByProject(QueryInitiativesByProjectRequest) returns (QueryInitiativesByProjectResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/initiatives_by_project/{project_id}";
  }

  // InitiativesByAssignee Queries a list of InitiativesByAssignee items.
  rpc InitiativesByAssignee(QueryInitiativesByAssigneeRequest) returns (QueryInitiativesByAssigneeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/initiatives_by_assignee/{assignee}";
  }

  // InitiativesByCreator Queries a list of InitiativesByCreator items.
  rpc InitiativesByCreator(QueryInitiativesByCreatorRequest) returns (QueryInitiativesByCreatorResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/initiatives_by_creator/{creator}";
  }

  // ProjectsByCreator Queries a list of ProjectsByCreator items.
  rpc ProjectsByCreator(QueryProjectsByCreatorRequest) returns (QueryProjectsByCreatorResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/projects_by_creator/{creator}";
  }

  // AvailableInitiatives Queries a list of AvailableInitiatives items.
  rpc AvailableInitiatives(QueryAvailableInitiativesRequest) returns (QueryAvailableInitiativesResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/available_initiatives";
  }

  // StakesByStaker Queries a list of StakesByStaker items.
  rpc StakesByStaker(QueryStakesByStakerRequest) returns (QueryStakesByStakerResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/stakes_by_staker/{staker}";
  }

  // StakesByTarget Queries a list of StakesByTarget items.
  rpc StakesByTarget(QueryStakesByTargetRequest) returns (QueryStakesByTargetResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/stakes_by_target/{target_type}/{target_id}";
  }

  // InitiativeConviction Queries a list of InitiativeConviction items.
  rpc InitiativeConviction(QueryInitiativeConvictionRequest) returns (QueryInitiativeConvictionResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/initiative_conviction/{initiative_id}";
  }

  // ChallengesByInitiative Queries a list of ChallengesByInitiative items.
  rpc ChallengesByInitiative(QueryChallengesByInitiativeRequest) returns (QueryChallengesByInitiativeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/challenges_by_initiative/{initiative_id}";
  }

  // Reputation Queries a list of Reputation items.
  rpc Reputation(QueryReputationRequest) returns (QueryReputationResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/reputation/{address}/{tag}";
  }

  // PendingStakeRewards queries pending rewards for a stake
  rpc PendingStakeRewards(QueryPendingStakeRewardsRequest) returns (QueryPendingStakeRewardsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/stake/{stake_id}/pending_rewards";
  }

  // GetMemberStakePool queries a member's stake pool info
  rpc GetMemberStakePool(QueryGetMemberStakePoolRequest) returns (QueryGetMemberStakePoolResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member_stake_pool/{member}";
  }

  // GetTagStakePool queries a tag's stake pool info
  rpc GetTagStakePool(QueryGetTagStakePoolRequest) returns (QueryGetTagStakePoolResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_stake_pool/{tag}";
  }

  // ListTagStakePools queries all tag stake pools with pagination.
  rpc ListTagStakePools(QueryListTagStakePoolsRequest) returns (QueryListTagStakePoolsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_stake_pool";
  }

  // GetProjectStakeInfo queries a project's stake info
  rpc GetProjectStakeInfo(QueryGetProjectStakeInfoRequest) returns (QueryGetProjectStakeInfoResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/project_stake_info/{project_id}";
  }

  // ContentConviction queries the total conviction score for a content item
  rpc ContentConviction(QueryContentConvictionRequest) returns (QueryContentConvictionResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/content_conviction/{target_type}/{target_id}";
  }

  // AuthorBond queries the author bond for a content item
  rpc AuthorBond(QueryAuthorBondRequest) returns (QueryAuthorBondResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/author_bond/{target_type}/{target_id}";
  }

  // GetContentChallenge queries a content challenge by ID
  rpc GetContentChallenge(QueryGetContentChallengeRequest) returns (QueryGetContentChallengeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/content_challenge/{id}";
  }

  // ListContentChallenge queries all content challenges with pagination
  rpc ListContentChallenge(QueryAllContentChallengeRequest) returns (QueryAllContentChallengeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/content_challenge";
  }

  // ContentChallengesByTarget queries content challenges by target type and ID
  rpc ContentChallengesByTarget(QueryContentChallengesByTargetRequest) returns (QueryContentChallengesByTargetResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/content_challenges_by_target/{target_type}/{target_id}";
  }

  // ContentByInitiative queries content items linked to an initiative for conviction propagation
  rpc ContentByInitiative(QueryContentByInitiativeRequest) returns (QueryContentByInitiativeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/content_by_initiative/{initiative_id}";
  }

  // DreamSupplyStats queries aggregate DREAM supply statistics
  rpc DreamSupplyStats(QueryDreamSupplyStatsRequest) returns (QueryDreamSupplyStatsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/dream_supply_stats";
  }

  // MintBurnRatio queries the current season's mint/burn ratio
  rpc MintBurnRatio(QueryMintBurnRatioRequest) returns (QueryMintBurnRatioResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/mint_burn_ratio";
  }

  // EffectiveApy queries the effective staking APY from the seasonal pool
  rpc EffectiveApy(QueryEffectiveApyRequest) returns (QueryEffectiveApyResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/effective_apy";
  }

  // TreasuryStatus queries the treasury balance and flows
  rpc TreasuryStatus(QueryTreasuryStatusRequest) returns (QueryTreasuryStatusResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/treasury_status";
  }

  // GetTag queries a specific tag by name.
  rpc GetTag(QueryGetTagRequest) returns (QueryGetTagResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag/{name}";
  }

  // ListTag queries all tags with pagination.
  rpc ListTag(QueryAllTagRequest) returns (QueryAllTagResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag";
  }

  // GetReservedTag queries a specific reserved tag by name.
  rpc GetReservedTag(QueryGetReservedTagRequest) returns (QueryGetReservedTagResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/reserved_tag/{name}";
  }

  // ListReservedTag queries all reserved tags with pagination.
  rpc ListReservedTag(QueryAllReservedTagRequest) returns (QueryAllReservedTagResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/reserved_tag";
  }

  // TagExists checks whether a tag exists and returns its expiration time.
  rpc TagExists(QueryTagExistsRequest) returns (QueryTagExistsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_exists/{tag_name}";
  }

  // GetTagReport queries a single tag report by tag name.
  rpc GetTagReport(QueryGetTagReportRequest) returns (QueryGetTagReportResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_report/{tag_name}";
  }

  // ListTagReport queries all tag reports with pagination.
  rpc ListTagReport(QueryAllTagReportRequest) returns (QueryAllTagReportResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_report";
  }

  // TagReports returns the first tag report (summary query).
  rpc TagReports(QueryTagReportsRequest) returns (QueryTagReportsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_reports";
  }

  // GetTagBudget Queries a TagBudget by id.
  rpc GetTagBudget(QueryGetTagBudgetRequest) returns (QueryGetTagBudgetResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_budget/{id}";
  }

  // ListTagBudget defines the ListTagBudget RPC.
  rpc ListTagBudget(QueryAllTagBudgetRequest) returns (QueryAllTagBudgetResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_budget";
  }

  // GetTagBudgetAward Queries a TagBudgetAward by id.
  rpc GetTagBudgetAward(QueryGetTagBudgetAwardRequest) returns (QueryGetTagBudgetAwardResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_budget_award/{id}";
  }

  // ListTagBudgetAward defines the ListTagBudgetAward RPC.
  rpc ListTagBudgetAward(QueryAllTagBudgetAwardRequest) returns (QueryAllTagBudgetAwardResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_budget_award";
  }

  // TagBudgetByTag Queries a TagBudget by tag name.
  rpc TagBudgetByTag(QueryTagBudgetByTagRequest) returns (QueryTagBudgetByTagResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_budget_by_tag/{tag}";
  }

  // TagBudgets returns the first tag budget (summary query).
  rpc TagBudgets(QueryTagBudgetsRequest) returns (QueryTagBudgetsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_budgets";
  }

  // TagBudgetAwards returns the first award for a budget (summary query).
  rpc TagBudgetAwards(QueryTagBudgetAwardsRequest) returns (QueryTagBudgetAwardsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/tag_budget_awards/{budget_id}";
  }

  // BondedRole queries a single BondedRole record by (role_type, address).
  rpc BondedRole(QueryBondedRoleRequest) returns (QueryBondedRoleResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/bonded_role/{role_type}/{address}";
  }

  // BondedRolesByType lists all BondedRole records for a given role_type.
  rpc BondedRolesByType(QueryBondedRolesByTypeRequest) returns (QueryBondedRolesByTypeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/bonded_roles_by_type/{role_type}";
  }

  // BondedRoleConfig queries the per-role policy config seeded at genesis and
  // kept in sync by the owning module's operational-params handler.
  rpc BondedRoleConfig(QueryBondedRoleConfigRequest) returns (QueryBondedRoleConfigResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/bonded_role_config/{role_type}";
  }

  // ListMemberReport Queries a list of MemberReport items.
  rpc GetMemberReport(QueryGetMemberReportRequest) returns (QueryGetMemberReportResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member_report/{member}";
  }

  // ListMemberReport defines the ListMemberReport RPC.
  rpc ListMemberReport(QueryAllMemberReportRequest) returns (QueryAllMemberReportResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member_report";
  }

  // ListMemberWarning Queries a list of MemberWarning items.
  rpc GetMemberWarning(QueryGetMemberWarningRequest) returns (QueryGetMemberWarningResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member_warning/{id}";
  }

  // ListMemberWarning defines the ListMemberWarning RPC.
  rpc ListMemberWarning(QueryAllMemberWarningRequest) returns (QueryAllMemberWarningResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member_warning";
  }

  // ListGovActionAppeal Queries a list of GovActionAppeal items.
  rpc GetGovActionAppeal(QueryGetGovActionAppealRequest) returns (QueryGetGovActionAppealResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/gov_action_appeal/{id}";
  }

  // ListGovActionAppeal defines the ListGovActionAppeal RPC.
  rpc ListGovActionAppeal(QueryAllGovActionAppealRequest) returns (QueryAllGovActionAppealResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/gov_action_appeal";
  }

  // ListJuryParticipation Queries a list of JuryParticipation items.
  rpc GetJuryParticipation(QueryGetJuryParticipationRequest) returns (QueryGetJuryParticipationResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/jury_participation/{juror}";
  }

  // ListJuryParticipation defines the ListJuryParticipation RPC.
  rpc ListJuryParticipation(QueryAllJuryParticipationRequest) returns (QueryAllJuryParticipationResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/jury_participation";
  }

  // MemberReports Queries the first member report (summary).
  rpc MemberReports(QueryMemberReportsRequest) returns (QueryMemberReportsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member_reports";
  }

  // MemberWarnings Queries the first warning for a member (summary).
  rpc MemberWarnings(QueryMemberWarningsRequest) returns (QueryMemberWarningsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member_warnings/{member}";
  }

  // MemberStanding Queries a member's current standing (warnings, active reports, trust tier).
  rpc MemberStanding(QueryMemberStandingRequest) returns (QueryMemberStandingResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/member_standing/{member}";
  }

  // RequiredInvitationStake Queries a list of RequiredInvitationStake items.
  rpc RequiredInvitationStake(QueryRequiredInvitationStakeRequest) returns (QueryRequiredInvitationStakeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/required_invitation_stake/{inviter}";
  }

  // AuthorBondsByType Queries a list of AuthorBondsByType items.
  rpc AuthorBondsByType(QueryAuthorBondsByTypeRequest) returns (QueryAuthorBondsByTypeResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/author_bonds_by_type/{target_type}";
  }

  // InitiativeReviews returns the bonded reviewers' verdicts on one initiative.
  rpc InitiativeReviews(QueryInitiativeReviewsRequest) returns (QueryInitiativeReviewsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/initiative_reviews/{initiative_id}";
  }

  // ReviewBounty returns the DREAM escrowed against an initiative to attract
  // reviewers, and when each contribution becomes reclaimable.
  rpc ReviewBounty(QueryReviewBountyRequest) returns (QueryReviewBountyResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/review_bounty/{initiative_id}";
  }

  // EscalatedReviews lists the review rounds awaiting an Operations Committee
  // decision.
  rpc EscalatedReviews(QueryEscalatedReviewsRequest) returns (QueryEscalatedReviewsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/escalated_reviews";
  }

  // RoleRewardPools reports the funding state of every bonded-role SPARK
  // reward pool, plus how much of today's community-pool allowance x/rep has
  // already drawn. Automatic funding is otherwise invisible: the pools are
  // derived sub-addresses with no other read surface.
  rpc RoleRewardPools(QueryRoleRewardPoolsRequest) returns (QueryRoleRewardPoolsResponse) {
    option (google.api.http).get = "/sparkdream/rep/v1/role_reward_pools";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGetMemberRequest defines the QueryGetMemberRequest message.
message QueryGetMemberRequest {
  string address = 1;
}

// QueryGetMemberResponse defines the QueryGetMemberResponse message.
message QueryGetMemberResponse {
  Member member = 1 [(gogoproto.nullable) = false];
}

// QueryAllMemberRequest defines the QueryAllMemberRequest message.
message QueryAllMemberRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllMemberResponse defines the QueryAllMemberResponse message.
message QueryAllMemberResponse {
  repeated Member member = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetInvitationRequest defines the QueryGetInvitationRequest message.
message QueryGetInvitationRequest {
  uint64 id = 1;
}

// QueryGetInvitationResponse defines the QueryGetInvitationResponse message.
message QueryGetInvitationResponse {
  Invitation invitation = 1 [(gogoproto.nullable) = false];
}

// QueryAllInvitationRequest defines the QueryAllInvitationRequest message.
message QueryAllInvitationRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllInvitationResponse defines the QueryAllInvitationResponse message.
message QueryAllInvitationResponse {
  repeated Invitation invitation = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetProjectRequest defines the QueryGetProjectRequest message.
message QueryGetProjectRequest {
  uint64 id = 1;
}

// QueryGetProjectResponse defines the QueryGetProjectResponse message.
message QueryGetProjectResponse {
  Project project = 1 [(gogoproto.nullable) = false];
}

// QueryAllProjectRequest defines the QueryAllProjectRequest message.
message QueryAllProjectRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
  // sort_by orders the full project set before pagination is applied.
  // Supported keys: "id" (default), "name", "budget" (approved budget),
  // "status". Direction follows pagination.reverse. When set, pagination is
  // offset-based (next_key is an offset, not a store key).
  string sort_by = 2;
}

// QueryAllProjectResponse defines the QueryAllProjectResponse message.
message QueryAllProjectResponse {
  repeated Project project = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetInitiativeRequest defines the QueryGetInitiativeRequest message.
message QueryGetInitiativeRequest {
