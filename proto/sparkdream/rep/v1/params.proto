syntax = "proto3";
package sparkdream.rep.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "sparkdream/x/rep/types";

// TierConfig defines configuration for an initiative tier
message TierConfig {
  option (gogoproto.equal) = true;

  string max_budget = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string min_reputation = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string reputation_cap = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string reward_multiplier = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

// TrustLevelConfig defines thresholds for trust level progression
message TrustLevelConfig {
  option (gogoproto.equal) = true;

  string provisional_min_rep = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint32 provisional_min_interims = 2;
  string established_min_rep = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint32 established_min_interims = 4;
  string trusted_min_rep = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint32 trusted_min_seasons = 6;
  string core_min_rep = 7 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint32 core_min_seasons = 8;

  // Invitation credits per trust level (max credits per season)
  // NEW level gets 0 (cannot invite)
  uint32 new_invitation_credits = 9;
  uint32 provisional_invitation_credits = 10;
  uint32 established_invitation_credits = 11;
  uint32 trusted_invitation_credits = 12;
  uint32 core_invitation_credits = 13;
}

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "sparkdream/x/rep/Params";
  option (gogoproto.equal) = true;

  // Time
  int64 epoch_blocks = 1;
  int64 season_duration_epochs = 2;

  // DREAM economics
  string unstaked_decay_rate = 3 [ // 0.2% per epoch (~73% annualized) — inactivity nudge
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string transfer_tax_rate = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string max_tip_amount = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  uint32 max_tips_per_epoch = 6;
  string max_gift_amount = 7 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  bool gift_only_to_invitees = 8;

  // Initiative rewards
  string completer_share = 9 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string treasury_share = 10 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string min_reputation_multiplier = 11 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Initiative tiers
  TierConfig apprentice_tier = 12 [(gogoproto.nullable) = false];
  TierConfig standard_tier = 13 [(gogoproto.nullable) = false];
  TierConfig expert_tier = 14 [(gogoproto.nullable) = false];
  TierConfig epic_tier = 15 [(gogoproto.nullable) = false];

  // Conviction
  int64 conviction_half_life_epochs = 16;
  string external_conviction_ratio = 17 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string conviction_per_dream = 18 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Review periods
  int64 default_review_period_epochs = 19;
  int64 default_challenge_period_epochs = 20;

  // Invitations
  string min_invitation_stake = 21 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  int64 invitation_accountability_epochs = 22;
  string referral_reward_rate = 23 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string invitation_cost_multiplier = 24 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Trust levels
  TrustLevelConfig trust_level_config = 25 [(gogoproto.nullable) = false];

  // Challenges
  string min_challenge_stake = 26 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string challenger_reward_rate = 27 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint32 jury_size = 28;
  string jury_super_majority = 29 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string min_juror_reputation = 30 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Interim compensation
  string simple_complexity_budget = 31 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string standard_complexity_budget = 32 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string complex_complexity_budget = 33 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string expert_complexity_budget = 34 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string solo_expert_bonus_rate = 35 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  int64 interim_deadline_epochs = 36;

  // Rate limits
  uint32 max_active_challenges_per_committee = 37;
  uint32 max_new_challenges_per_epoch = 38;
  uint32 challenge_queue_max_size = 39;

  // Slashing
  string minor_slash_penalty = 40 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string moderate_slash_penalty = 41 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string severe_slash_penalty = 42 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string zeroing_slash_penalty = 43 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Extended staking
  string project_completion_bonus_rate = 44 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string member_stake_revenue_share = 45 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string tag_stake_revenue_share = 46 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  int64 min_stake_duration_seconds = 47;
  bool allow_self_member_stake = 48;

  // Challenge response deadline (epochs)
  // If assignee doesn't respond within this time, challenge is auto-upheld
  int64 challenge_response_deadline_epochs = 49;

  // Gift rate limiting
  // Cooldown period in blocks before same sender can gift same recipient again
  int64 gift_cooldown_blocks = 50;
  // Maximum total DREAM a sender can gift per epoch (across all recipients)
  string max_gifts_per_sender_epoch = 51 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Content conviction staking
  int64 content_conviction_half_life_epochs = 52; // Half-life for content conviction decay (default: 14 epochs)
  string max_content_stake_per_member = 53 [ // Max DREAM one member can stake on a single content item
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string max_author_bond_per_content = 54 [ // Max DREAM an author can bond on their own content
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  bool author_bond_slash_on_moderation = 55; // Whether to slash author bonds when content is moderated
  string content_challenge_reward_share = 56 [ // Fraction of slashed author bond given to challenger (rest burned), default 0.5
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string conviction_propagation_ratio = 57 [ // Fraction of linked content conviction propagated to initiative (default 0.10)
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Tag anti-gaming
  uint32 max_tags_per_initiative = 58; // Max tags allowed per initiative (default 3, prevents tag stuffing)

  // Anti-gaming parameters
  string reputation_decay_rate = 59 [ // Per-epoch decay rate for reputation scores (default 0.001 = 0.1%)
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string max_conviction_share_per_member = 60 [ // Max fraction of required conviction any single member can contribute (default 0.33)
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string invitation_stake_burn_rate = 61 [ // Fraction of invitation stake burned on acceptance (default 0.10 = 10%)
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string max_reputation_gain_per_epoch = 62 [ // Max reputation any member can earn per tag per epoch (default 50)
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Seasonal staking reward pool
  string max_staking_rewards_per_season = 63 [ // Total DREAM minted per season for staking rewards (default: 25,000 DREAM)
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string staked_decay_rate = 64 [ // Per-epoch decay on staked DREAM (default 0.05% = 0.0005)
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  int64 new_member_decay_grace_epochs = 65; // Epochs new members are exempt from decay (default 30 ~1 month)

  // Treasury management
  string max_treasury_balance = 66 [ // Excess above this is burned each epoch (default: 100,000 DREAM)
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  bool treasury_funds_interims = 67; // Pay interims from treasury first, mint only if empty (default true)
  bool treasury_funds_retro_pgf = 68; // Pay retro PGF from treasury first, mint remainder (default true)

  // Anti-whale staking cap: max DREAM one member can stake on a single initiative (default 50,000 DREAM)
  // Prevents reward pool extraction — conviction is already capped by max_conviction_share_per_member,
  // but without this cap, a whale can stake disproportionately and extract most seasonal staking rewards.
  string max_initiative_stake_per_member = 69 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Per-season cap on total DREAM minted via initiative completion rewards (default 100,000 DREAM).
  // Bounds total extraction even if colluding members rubber-stamp initiatives.
  string max_initiative_rewards_per_season = 70 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Projects with approved budget above this threshold require council proposal approval
  // instead of single Operations Committee member approval (default 10,000 DREAM).
  string large_project_budget_threshold = 71 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Permissionless creation fees (burned on creation — anti-spam + deflationary)
  string project_creation_fee = 72 [ // DREAM burned when creating a permissionless project (default 5 DREAM)
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string initiative_creation_fee_apprentice = 73 [ // DREAM burned for apprentice initiative under permissionless project (default 1 DREAM)
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string initiative_creation_fee_standard = 74 [ // DREAM burned for standard initiative under permissionless project (default 3 DREAM)
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Permissionless access control (governance-only — not in RepOperationalParams)
  uint32 permissionless_min_trust_level = 75; // Minimum trust level to create a permissionless project (default 2 = ESTABLISHED)
  uint32 permissionless_max_tier = 76; // Highest initiative tier allowed in permissionless projects (default 1 = STANDARD)

  string tag_creation_fee = 77 [ // DREAM burned when creating a member-registered tag (default 100 micro-DREAM)
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Sentinel SPARK reward pool (x/rep holds SPARK fed by spam taxes;
  // drained each epoch to sentinels according to accuracy/activity gates).
  string max_sentinel_reward_pool = 78 [ // Upper cap (uspark). Excess is burned at ratio below (default 100,000 SPARK).
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string sentinel_reward_pool_overflow_burn_ratio = 79 [ // Fraction of overflow burned per epoch (default 0.5).
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint64 sentinel_reward_epoch_blocks = 80; // Cadence of sentinel reward distribution (default 14400 ~= 1 day).
  string min_sentinel_accuracy = 81 [ // Minimum accuracy to qualify for a reward (default 0.70).
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint64 min_appeals_for_accuracy = 82; // Minimum appeal sample size before accuracy is meaningful (default 10).
  uint64 min_epoch_activity_for_reward = 83; // Minimum moderation actions in an epoch to qualify for a reward (default 1).
  string min_appeal_rate = 84 [ // Minimum appeal rate (appeals / actions) to qualify for a reward (default 0.05).
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // Rolling window (in reward epochs) over which sentinel reward accuracy is
  // measured. Recent overturns move the ratio; inactivity ages a sentinel out.
  // Bounded 1 <= W <= MaxSentinelAccuracyWindowEpochs (== the forum
  // SentinelAccuracyRingSize). Default 6.
  uint64 sentinel_accuracy_window_epochs = 91;

  // Per-member active work caps (anti-monopolization). 0 = unbounded.
  uint32 max_active_initiatives_per_member = 85; // Max in-flight initiatives (OPEN..CHALLENGED) where the member is assignee (default 10)
  uint32 max_active_interims_per_member = 86; // Max in-flight interims (PENDING/IN_PROGRESS) where the member is an assignee (default 10)

  // Global per-epoch ceiling on DREAM minted across every path (initiative rewards,
  // referral rewards, interim compensation, retro PGF, jury rewards, etc.). Counter
  // resets at the first MintDREAM of each new epoch. 0 = unbounded.
  string max_dream_mint_per_epoch = 87 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Absolute upper bound on requested_budget at proposal time. Distinct from
  // large_project_budget_threshold (which is an approval-time routing rule):
  // this is a hard cap that rejects nonsense values (e.g. 10^30 DREAM) and
  // keeps state clean. Set well above any legitimate project size so council-
  // gated large proposals are not blocked. Must be positive.
  string max_project_requested_budget = 88 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Absolute upper bound on requested_spark at proposal time. Same role as
  // max_project_requested_budget but for SPARK (uspark). Must be positive.
  string max_project_requested_spark = 89 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Number of blocks a PROPOSED (non-permissionless) project stays open before
  // the EndBlocker transitions it to PROJECT_STATUS_EXPIRED. Prevents state
  // pollution by stale unapproved proposals. Must be positive.
  int64 proposed_project_expiry_blocks = 90;

  // Self-assignment safeguards. A member MAY assign themselves an initiative
  // they created (or one under a project they created); conflict-of-interest
  // is handled at the judging layer instead of an assignment-time ban (mirrors
  // x/reveal's contributor exclusion). These knobs harden the self-assigned
  // path. "Self-assigned" means the assignee authored the initiative or the
  // parent project — checking only the latter let anyone create an initiative
  // under someone else's project and self-assign to dodge all three.

  // Fraction of the initiative budget locked as a DREAM bond when an
  // initiative is self-assigned on a budget-backed project. Bond is returned
  // on completion or abandonment and burned when a challenge is upheld.
  // Range [0, 1]; 0 disables.
  string self_assigned_bond_rate = 92 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // External-conviction ratio applied instead of external_conviction_ratio when
  // the initiative is self-assigned. Must be >= external_conviction_ratio and
  // <= 1. Default 0.75 — a distinct-staker floor as much as a magnitude one,
  // since max_conviction_share_per_member caps any one member's contribution:
  // ceil(0.75 / 0.33) = 3 independent stakers, against 2 for externally
  // assigned work.
  string self_assigned_external_conviction_ratio = 93 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  // Multiplier applied to the challenge window for self-assigned initiatives.
  // Must be >= 1. Default 2.
  int64 self_assigned_challenge_multiplier = 94;

  // Bond rate applied instead of self_assigned_bond_rate when the initiative
  // is self-assigned under a permissionless project. Higher because the two
  // cases expose the commons differently: a budget-backed initiative MOVES
  // DREAM that governance already approved, while a permissionless one MINTS
  // DREAM nobody approved and dilutes every holder. Permissionless
  // self-assignment used to be exempt from the bond entirely, which disabled
  // the main economic deterrent exactly where no counterparty exists.
  // Range [0, 1]; 0 disables. Default 0.25.
  string permissionless_self_assigned_bond_rate = 95 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // Reputation deducted, per tag of the disputed initiative, from a juror who
  // accepted a summons and then let it lapse. Accepting is voluntary and
  // declining is free and immediate, so an abandoned seat is a broken
  // commitment rather than an accident of the draw.
  //
  // Charged in reputation because that is what qualifies a juror: enough
  // abandoned seats and they fall below min_juror_reputation and stop being
  // drawn for that tag at all. Must be non-negative; 0 disables. Default 10.
  string abandoned_jury_seat_penalty = 96 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // Fraction of the disputed initiative's budget paid out to its jury, split
  // evenly across the seats. Juror pay was a flat StandardComplexityBudget
  // regardless of what was in dispute, so a challenge over a 100 DREAM
  // APPRENTICE initiative minted 750 DREAM in juror fees to settle it — more
  // than the work was worth. Range [0, 1]. Default 0.25.
  string juror_reward_rate = 97 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // Fraction of an initiative's review period a juror has to answer a summons
  // before the seat is swept and redrawn.
  //
  // A ratio rather than a block count because the review period varies by two
  // orders of magnitude across networks: the previous fixed 1200-block (~2h)
  // window was 1.2% of mainnet's ~7-day review but 133% of devnet's, putting
  // the acceptance deadline *after* the vote deadline there and making the
  // sweep unreachable. It also contradicted the reason no-shows go unpunished
  // — that a member cannot be expected to watch the chain for an event that
  // reaches them about once a year — by then withdrawing the seat if they did
  // not answer within two hours.
  //
  // Sized for how long it takes someone to read a notification, not to react
  // to a block. Range (0, 1). Default 0.25 — about 42 hours on mainnet.
  //
  // Operational alongside the other juror knobs: leaving juror *pay* committee
  // tunable while juror *timing* needed a governance vote was an artifact of
  // build order, not a decision.
  string jury_acceptance_window_ratio = 98 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // Floor on a single juror's pay, in micro-DREAM.
  //
  // juror_reward_rate scales pay against the disputed initiative's budget, but
  // content challenges and moderation appeals have no initiative budget to
  // scale against — for those this floor *is* the whole rate, which is why it
  // cannot stay a compile-time constant. Default 5 DREAM.
  string min_juror_reward = 99 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
