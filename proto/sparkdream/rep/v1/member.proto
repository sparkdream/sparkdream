syntax = "proto3";
package sparkdream.rep.v1;

import "gogoproto/gogo.proto";

option go_package = "sparkdream/x/rep/types";

// Member defines the Member message.
message Member {
  string address = 1;

  // DREAM balance
  string dream_balance = 2 [(gogoproto.customtype) = "cosmossdk.io/math.Int"];
  string staked_dream = 3 [(gogoproto.customtype) = "cosmossdk.io/math.Int"];
  string lifetime_earned = 4 [(gogoproto.customtype) = "cosmossdk.io/math.Int"];
  string lifetime_burned = 5 [(gogoproto.customtype) = "cosmossdk.io/math.Int"];

  // Reputation (current season)
  map<string, string> reputation_scores = 6; // tag -> score as decimal string

  // Reputation (lifetime archive)
  map<string, string> lifetime_reputation = 7;

  // Trust
  TrustLevel trust_level = 8;
  int64 trust_level_updated_at = 9;

  // Invitation info
  uint32 joined_season = 10;
  int64 joined_at = 11;
  string invited_by = 12;
  repeated string invitation_chain = 13; // ancestors, max 5
  uint32 invitation_credits = 14;

  // Status
  MemberStatus status = 15;
  int64 zeroed_at = 16;
  uint32 zeroed_count = 17;
  int64 last_decay_epoch = 18;
  uint32 tips_given_this_epoch = 19;
  int64 last_tip_epoch = 20;

  // Cached counts for performance (avoid full table scans)
  uint32 completed_interims_count = 21; // Incremented on interim completion
  uint32 completed_initiatives_count = 22; // Incremented on initiative completion

  // Gift tracking for rate limiting
  string gifts_sent_this_epoch = 23 [(gogoproto.customtype) = "cosmossdk.io/math.Int"]; // Total DREAM gifted this epoch
  int64 last_gift_epoch = 24; // Epoch when gift counter was last reset

  // Invitation credit tracking for lazy seasonal reset
  int64 last_credit_reset_season = 25; // Season when credits were last reset to trust-level max

  // Per-epoch reputation gain cap tracking
  // Maps tag -> stringified Dec of reputation gained in the current epoch
  map<string, string> reputation_gained_this_epoch = 26;
  int64 last_rep_gain_epoch = 27; // Epoch when reputation gain counter was last reset

  // ZK public key for anonymous operations (trust tree leaf computation).
  // Set via MsgRegisterZkPublicKey. Used by the persistent Merkle tree
  // to build leaves as MiMC(zk_public_key, trust_level).
  bytes zk_public_key = 28;

  // Salvation counters.
  // epoch_salvations: count of salvations performed in the current epoch.
  // last_salvation_epoch: Unix timestamp marking the start of the current
  // salvation epoch window.
  uint32 epoch_salvations = 29;
  int64 last_salvation_epoch = 30;

  // forum_rep_per_tag is per-tag reputation earned through forum activity
  // (conviction-staked endorsements on posts and replies). Stored separately
  // from reputation_scores so the trust-level ladder can include it for
  // PROVISIONAL and ESTABLISHED tiers while excluding it from TRUSTED and
  // CORE — forum participation is legitimate early-stage contribution but
  // is cheaper to game than verified initiative output, so it must not gate
  // the high-consequence council-adjacent tiers. Slashable on confirmed
  // hide of the post that produced the rep (see x/forum
  // PostConvictionStake.accrued_rep_per_tag). Map key is tag name, value is
  // a decimal string (math.LegacyDec).
  map<string, string> forum_rep_per_tag = 31;

  // lifetime_forum_rep_per_tag accumulates forum_rep_per_tag across all
  // completed seasons. Reset on season transition: forum_rep_per_tag is
  // added to this map then cleared (mirroring lifetime_reputation /
  // reputation_scores). Display-only — never read by the trust-level
  // ladder. Keeps the historical signal visible on profiles without
  // letting forum participation gate higher tiers across seasons.
  map<string, string> lifetime_forum_rep_per_tag = 32;

  // Block height at which the member joined. This is the height-domain
  // twin of joined_at (a unix timestamp): the new-member decay grace
  // window is denominated in epochs — height / epoch_blocks — so it must
  // be measured against a height, not a timestamp. Dividing the unix
  // timestamp by epoch_blocks produced an astronomically large "join
  // epoch", a deeply negative member age, and a grace window that never
  // expired for invited members (genesis-seeded members with joined_at=0
  // were unaffected). Members restored from genesis written before this
  // field carry 0, which reads as "joined at genesis" — they exit grace
  // after NewMemberDecayGraceEpochs epochs, the same behaviour
  // genesis-seeded members have always had.
  int64 joined_at_height = 33;

  // Aggregate DREAM this member currently holds in content-conviction stakes
  // across ALL content items (blog, forum, collection). Backs the per-member
  // max_total_content_stake_per_member cap: the per-item cap only sets the
  // granularity of parking DREAM here, so the aggregate is what bounds the
  // total. (Content stakes earn no DREAM but do decay.) Maintained
  // by updateStakePoolTotals — the single choke point for stake-amount
  // mutations — and recomputed by ReconcileStakePoolTotals on genesis import.
  // Author bonds are not counted here; they are slashable escrow with their
  // own per-item cap. Nil on records written before this field existed;
  // readers must treat nil as zero.
  string content_staked_dream = 34 [(gogoproto.customtype) = "cosmossdk.io/math.Int"];
}

enum TrustLevel {
  TRUST_LEVEL_NEW = 0;
  TRUST_LEVEL_PROVISIONAL = 1;
  TRUST_LEVEL_ESTABLISHED = 2;
  TRUST_LEVEL_TRUSTED = 3;
  TRUST_LEVEL_CORE = 4;
}

enum MemberStatus {
  MEMBER_STATUS_ACTIVE = 0;
  MEMBER_STATUS_INACTIVE = 1;
  MEMBER_STATUS_ZEROED = 2;
}

// GiftRecord tracks the last time a sender gifted a specific recipient
// Used to enforce per-recipient cooldown periods
message GiftRecord {
  string sender = 1;
  string recipient = 2;
  int64 last_gift_block = 3; // Block height when last gift was sent
}
