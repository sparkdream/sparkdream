syntax = "proto3";
package sparkdream.rep.v1;

import "gogoproto/gogo.proto";

option go_package = "sparkdream/x/rep/types";

// Invitation defines the Invitation message.
message Invitation {
  uint64 id = 1;
  string inviter = 2;
  string invitee_address = 3;

  string staked_dream = 4 [(gogoproto.customtype) = "cosmossdk.io/math.Int"];
  repeated string vouched_tags = 5;

  // accountability_end / referral_end: unix-time estimates for display,
  // derived from the epochs below at a nominal 6 s per block. The chain
  // decides on created_epoch and accountability_end_epoch, which follow the
  // block-based epoch clock exactly.
  int64 accountability_end = 6;
  string referral_rate = 7 [(gogoproto.customtype) = "cosmossdk.io/math.LegacyDec"];
  int64 referral_end = 8;
  string referral_earned = 9 [(gogoproto.customtype) = "cosmossdk.io/math.Int"];

  InvitationStatus status = 10;
  int64 created_at = 11;
  int64 accepted_at = 12;
  // created_epoch: rep epoch the invitation was created in. The acceptance
  // window (invitation_acceptance_epochs) is counted from it.
  int64 created_epoch = 13;
  // accountability_end_epoch: last rep epoch of the inviter accountability
  // and referral window (created_epoch + invitation_accountability_epochs).
  int64 accountability_end_epoch = 14;
}

enum InvitationStatus {
  INVITATION_STATUS_PENDING = 0;
  INVITATION_STATUS_ACCEPTED = 1;
  INVITATION_STATUS_EXPIRED = 2;
  INVITATION_STATUS_REVOKED = 3;
}
