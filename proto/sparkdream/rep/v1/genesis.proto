syntax = "proto3";

package sparkdream.rep.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "sparkdream/rep/v1/bonded_role.proto";
import "sparkdream/rep/v1/challenge.proto";
import "sparkdream/rep/v1/content_challenge.proto";
import "sparkdream/rep/v1/gov_action_appeal.proto";
import "sparkdream/rep/v1/initiative.proto";
import "sparkdream/rep/v1/initiative_review.proto";
import "sparkdream/rep/v1/interim.proto";
import "sparkdream/rep/v1/invitation.proto";
import "sparkdream/rep/v1/jury_participation.proto";
import "sparkdream/rep/v1/jury_review.proto";
import "sparkdream/rep/v1/member.proto";
import "sparkdream/rep/v1/member_report.proto";
import "sparkdream/rep/v1/member_warning.proto";
import "sparkdream/rep/v1/params.proto";
import "sparkdream/rep/v1/project.proto";
import "sparkdream/rep/v1/reserved_tag.proto";
import "sparkdream/rep/v1/review_bounty.proto";
import "sparkdream/rep/v1/role_activity.proto";
import "sparkdream/rep/v1/stake.proto";
import "sparkdream/rep/v1/tag.proto";
import "sparkdream/rep/v1/tag_budget.proto";
import "sparkdream/rep/v1/tag_budget_award.proto";
import "sparkdream/rep/v1/tag_report.proto";

option go_package = "sparkdream/x/rep/types";

// GenesisState defines the rep module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Member member_map = 2 [(gogoproto.nullable) = false];
  repeated Invitation invitation_list = 3 [(gogoproto.nullable) = false];
  uint64 invitation_count = 4;
  repeated Project project_list = 5 [(gogoproto.nullable) = false];
  uint64 project_count = 6;
  repeated Initiative initiative_list = 7 [(gogoproto.nullable) = false];
  uint64 initiative_count = 8;
  repeated Stake stake_list = 9 [(gogoproto.nullable) = false];
  uint64 stake_count = 10;
  repeated Challenge challenge_list = 11 [(gogoproto.nullable) = false];
  uint64 challenge_count = 12;
  repeated JuryReview jury_review_list = 13 [(gogoproto.nullable) = false];
  uint64 jury_review_count = 14;
  repeated Interim interim_list = 15 [(gogoproto.nullable) = false];
  uint64 interim_count = 16;

  // Stake pools (for extended staking)
  repeated MemberStakePool member_stake_pool_list = 17 [(gogoproto.nullable) = false];
  repeated TagStakePool tag_stake_pool_list = 18 [(gogoproto.nullable) = false];
  repeated ProjectStakeInfo project_stake_info_list = 19 [(gogoproto.nullable) = false];

  // Content challenges
  repeated ContentChallenge content_challenge_list = 20 [(gogoproto.nullable) = false];
  uint64 content_challenge_count = 21;

  // Content initiative links for conviction propagation
  repeated ContentInitiativeLink content_initiative_links = 22 [(gogoproto.nullable) = false];

  // Tag registry
  repeated Tag tag_map = 23 [(gogoproto.nullable) = false];
  repeated ReservedTag reserved_tag_map = 24 [(gogoproto.nullable) = false];

  // Tag moderation
  repeated TagReport tag_report_map = 25 [(gogoproto.nullable) = false];

  // Tag budgets
  repeated TagBudget tag_budget_list = 26 [(gogoproto.nullable) = false];
  uint64 tag_budget_count = 27;
  repeated TagBudgetAward tag_budget_award_list = 28 [(gogoproto.nullable) = false];
  uint64 tag_budget_award_count = 29;

  // Accountability state
  repeated JuryParticipation jury_participation_map = 30 [(gogoproto.nullable) = false];
  repeated MemberReport member_report_map = 31 [(gogoproto.nullable) = false];
  repeated MemberWarning member_warning_list = 32 [(gogoproto.nullable) = false];
  uint64 member_warning_count = 33;
  repeated GovActionAppeal gov_action_appeal_list = 34 [(gogoproto.nullable) = false];
  uint64 gov_action_appeal_count = 35;

  // Bonded-role primitive (Phase 1 of bonded-role generalization).
  repeated BondedRole bonded_role_list = 36 [(gogoproto.nullable) = false];
  repeated BondedRoleConfig bonded_role_config_list = 37 [(gogoproto.nullable) = false];
  repeated RoleActivity role_activity_list = 38 [(gogoproto.nullable) = false];
  // Reviewer verdicts. Their bond_reserved is live liability, so losing them on
  // import would strand committed bond with nothing to release it.
  repeated InitiativeReview initiative_review_list = 39 [(gogoproto.nullable) = false];
  // Review rounds sitting with the Operations Committee. This set is the ONLY
  // marker for "already escalated" — ReviewEscalation is reset to NONE on
  // escalation — so losing it on import re-escalates every open round and
  // extends its deadline again, and leaves silent escalations with nothing to
  // resolve them.
  repeated uint64 escalated_review_list = 40;
  // Per-UTC-day community-pool draw ledger for the bonded-role reward pools.
  // Dropping it on import hands the chain a fresh daily allowance.
  repeated RoleRewardDayFunding role_reward_day_funding_list = 41 [(gogoproto.nullable) = false];
  // Escrowed review bounties. Real DREAM is held against these, so losing them
  // on import would strand the escrow with nothing able to pay or refund it.
  repeated ReviewBounty review_bounty_list = 42 [(gogoproto.nullable) = false];

  // The module's own token ledger and accumulators. x/rep keeps DREAM outside
  // x/bank, so none of this is recoverable from anywhere else — an export that
  // omits it hands the importing chain a zero treasury, zero season counters
  // (re-opening every per-season cap mid-season), a zero seasonal pool (so the
  // "only seed an uninitialised pool" guard in InitGenesis refills a whole
  // season budget on every import), a reset per-epoch mint allowance, and a
  // decay clock that re-applies an extra epoch.
  EconomicState economic_state = 43;

  // Per-recipient gift cooldown records. Not exported meant a capped gift
  // re-enabled itself across a restart.
  repeated GiftRecordEntry gift_record_list = 44 [(gogoproto.nullable) = false];
}

// EconomicState carries x/rep's token ledger across a genesis round trip.
// Int and Dec values travel as strings so an absent field reads as zero rather
// than as a malformed number.
message EconomicState {
  string treasury_balance = 1;
  string season_minted = 2;
  string season_burned = 3;
  string season_initiative_rewards_minted = 4;
  string season_staking_rewards_minted = 5;
  string season_interim_rewards_minted = 6;
  string season_treasury_inflow = 7;
  string season_treasury_outflow = 8;
  string seasonal_pool_remaining = 9;
  // Monotonic for the life of the chain. Exporting it is what lets
  // RebaseStakeRewardDebt be a no-op on a faithful round trip instead of the
  // repair it has to be when the accumulator resets to zero.
  string seasonal_pool_acc_per_share = 10;
  uint64 seasonal_pool_season = 11;
  uint64 seasonal_pool_start_epoch = 12;
  uint64 epoch_minted_epoch = 13;
  string epoch_minted_amount = 14;
  uint64 decay_last_processed_epoch = 15;
}

// GiftRecordEntry is one (sender, recipient) gift cooldown record, flattened
// for genesis because the live collection is keyed by the pair.
message GiftRecordEntry {
  string sender = 1;
  string recipient = 2;
  GiftRecord record = 3;
}

// RoleRewardDayFunding is one UTC day's community-pool draw for the
// bonded-role reward pools, ledgered so role_reward_daily_funding bounds a day
// rather than a block.
message RoleRewardDayFunding {
  uint64 day = 1;
  string amount_funded = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// ContentInitiativeLink defines a link between content and an initiative for conviction propagation.
message ContentInitiativeLink {
  uint64 initiative_id = 1;
  int32 target_type = 2; // StakeTargetType (4=BLOG_CONTENT, 5=FORUM_CONTENT)
  uint64 target_id = 3; // Content ID
}
