syntax = "proto3";
package sparkdream.rep.v1;

import "gogoproto/gogo.proto";

option go_package = "sparkdream/x/rep/types";

// JuryReview defines the JuryReview message.
message JuryReview {
  uint64 id = 1;
  uint64 challenge_id = 2;
  uint64 initiative_id = 3;

  repeated string jurors = 4;
  uint32 required_votes = 5;
  repeated string expert_witnesses = 6;
  repeated ExpertTestimony testimonies = 7;

  string review_deliverable = 8;
  string challenger_claim = 9;
  string assignee_response = 10;

  repeated JurorVote votes = 11;
  int64 deadline = 12;
  Verdict verdict = 13;
  string reasoning = 14;

  // For content challenges (non-zero means this review is for a content challenge, not an initiative challenge)
  uint64 content_challenge_id = 15;

  // Block height by which a seated juror must accept, after which unanswered
  // seats are vacated and redrawn (see SweepUnansweredJurySeats).
  int64 acceptance_deadline = 16;

  // Jurors who have accepted the summons. Accepting is what converts a seat
  // drawn by lot into a commitment: jurors are conscripted by sortition, so
  // penalising a no-show who never agreed to serve would punish an accident of
  // the draw. Declining is free and immediate; ignoring the summons is what
  // costs a seat and counts against the participation rate.
  repeated string accepted = 17;

  // How many replacement rounds this review has been through. Bounded by
  // MaxJuryRedraws so a review cannot redraw forever against a pool that will
  // not answer.
  uint32 redraw_count = 18;
}

message JurorVote {
  string juror = 1;
  repeated CriteriaVote criteria_votes = 2;
  Verdict verdict = 3;
  string confidence = 4 [(gogoproto.customtype) = "cosmossdk.io/math.LegacyDec"];
  string reasoning = 5;
  int64 submitted_at = 6;
}

message ExpertTestimony {
  string expert = 1;
  string opinion = 2;
  string reasoning = 3;
  int64 submitted_at = 4;
}

message CriteriaVote {
  string criteria_id = 1;
  bool passed = 2;
  uint32 score = 3;
  string notes = 4;
}

enum Verdict {
  VERDICT_PENDING = 0;
  VERDICT_UPHOLD_CHALLENGE = 1;
  VERDICT_REJECT_CHALLENGE = 2;
  VERDICT_INCONCLUSIVE = 3;
}
