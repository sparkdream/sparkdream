syntax = "proto3";
package sparkdream.storage.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "sparkdream/storage/v1/params.proto";
import "sparkdream/storage/v1/storage.proto";

option go_package = "sparkdream/x/storage/types";

// GenesisState defines the storage module's genesis state. Indexes and
// timers are rebuilt from the requests on import.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated Backend backends = 2 [(gogoproto.nullable) = false];
  repeated ApprovedOperator approved_operators = 3 [(gogoproto.nullable) = false];
  repeated ApprovedScanner approved_scanners = 4 [(gogoproto.nullable) = false];
  repeated Request requests = 5 [(gogoproto.nullable) = false];
  repeated RemovedHash removed_hashes = 6 [(gogoproto.nullable) = false];
  repeated CounterEntry counters = 7 [(gogoproto.nullable) = false];
  // request_seq is the last request id handed out.
  uint64 request_seq = 8;
}
