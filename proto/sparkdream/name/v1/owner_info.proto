syntax = "proto3";
package sparkdream.name.v1;

option go_package = "sparkdream/x/name/types";

// OwnerInfo defines the OwnerInfo message.
message OwnerInfo {
  string address = 1;
  string primary_name = 2;
  int64 last_active_time = 3;
  // Free-form display name. Bytes-validated only: NFC, no control or
  // zero-width chars, no newlines, 1-32 codepoints. Not unique. Not
  // required to own a primary_name.
  string display_name = 4;
  // Set by the x/rep zeroing hook: every name this address owns is
  // released and can be scavenged at once (IsOwnerExpired reports true),
  // whatever last_active_time says. A zeroed address never clears it.
  bool scavengeable = 5;
}
