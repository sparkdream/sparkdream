syntax = "proto3";

package sparkdream.name.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "sparkdream/name/v1/params.proto";

option go_package = "sparkdream/x/name/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // UpdateOperationalParams defines an operation for updating the module's
  // operational parameters. Authorized for Commons Council Operations Committee.
  rpc UpdateOperationalParams(MsgUpdateOperationalParams) returns (MsgUpdateOperationalParamsResponse);

  // RegisterName defines the RegisterName RPC.
  rpc RegisterName(MsgRegisterName) returns (MsgRegisterNameResponse);

  // SetPrimary defines the SetPrimary RPC.
  rpc SetPrimary(MsgSetPrimary) returns (MsgSetPrimaryResponse);

  // FileDispute files a name ownership dispute with DREAM staking.
  rpc FileDispute(MsgFileDispute) returns (MsgFileDisputeResponse);

  // ContestDispute allows the current name owner to contest a filed dispute.
  // Triggers jury review via x/rep.
  rpc ContestDispute(MsgContestDispute) returns (MsgContestDisputeResponse);

  // ResolveDispute resolves a name dispute after jury verdict or governance decision.
  rpc ResolveDispute(MsgResolveDispute) returns (MsgResolveDisputeResponse);

  // UpdateName defines the UpdateName RPC.
  rpc UpdateName(MsgUpdateName) returns (MsgUpdateNameResponse);

  // SetDisplayName sets (or clears) the free-form display name on the
  // signer's OwnerInfo. Empty display_name clears the field.
  rpc SetDisplayName(MsgSetDisplayName) returns (MsgSetDisplayNameResponse);

  // SetTarget sets (or clears) the resolver target for an owned name.
  // Forward resolution returns target when set, owner otherwise.
  rpc SetTarget(MsgSetTarget) returns (MsgSetTargetResponse);

  // AcceptTarget consents to a name pointing at the signer's address.
  // Required before the signer may set the name as primary for reverse
  // resolution.
  rpc AcceptTarget(MsgAcceptTarget) returns (MsgAcceptTargetResponse);

  // TransferName transfers ownership of a name from the current owner to a
  // new owner. The recipient must be an active x/rep member. Rejected while
  // the name has an active dispute.
  rpc TransferName(MsgTransferName) returns (MsgTransferNameResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgUpdateOperationalParams is the Msg/UpdateOperationalParams request type.
// Authorized: Commons Council Operations Committee (via IsCouncilAuthorized).
message MsgUpdateOperationalParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgUpdateOperationalParams";

  // authority is the address authorized to update operational params.
  // Can be: governance authority, Commons Council policy address,
  // or Commons Operations Committee member.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // operational_params defines the operational parameters to update.
  // NOTE: All operational parameters must be supplied.
  NameOperationalParams operational_params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateOperationalParamsResponse defines the response structure for executing a
// MsgUpdateOperationalParams message.
message MsgUpdateOperationalParamsResponse {}

// MsgRegisterName defines the MsgRegisterName message.
message MsgRegisterName {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgRegisterName";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  string data = 3;
}

// MsgRegisterNameResponse defines the MsgRegisterNameResponse message.
message MsgRegisterNameResponse {}

// MsgSetPrimary defines the MsgSetPrimary message.
message MsgSetPrimary {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgSetPrimary";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
}

// MsgSetPrimaryResponse defines the MsgSetPrimaryResponse message.
message MsgSetPrimaryResponse {}

// MsgFileDispute files a name dispute. The claimant stakes DREAM tokens.
message MsgFileDispute {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgFileDispute";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  string reason = 3; // Why the claimant believes they should own this name
}

// MsgFileDisputeResponse defines the MsgFileDisputeResponse message.
message MsgFileDisputeResponse {}

// MsgContestDispute allows the current name owner to contest a dispute.
// The owner stakes DREAM tokens and a jury review is triggered.
message MsgContestDispute {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgContestDispute";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"]; // Current owner
  string name = 2;
  string reason = 3; // Why the dispute is invalid
}

// MsgContestDisputeResponse defines the response for MsgContestDispute.
message MsgContestDisputeResponse {}

// MsgResolveDispute resolves a name dispute.
// Authorized: Commons Council, Operations Committee, governance authority, or x/rep jury callback.
message MsgResolveDispute {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgResolveDispute";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  string new_owner = 3; // Only used if transfer_approved
  bool transfer_approved = 4; // true = name transfers to claimant, false = dismiss dispute
}

// MsgResolveDisputeResponse defines the MsgResolveDisputeResponse message.
message MsgResolveDisputeResponse {}

// MsgUpdateName defines the MsgUpdateName message.
message MsgUpdateName {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "sparkdream/x/name/MsgUpdateName";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  string data = 3;
}

// MsgUpdateNameResponse defines the MsgUpdateNameResponse message.
message MsgUpdateNameResponse {
  string name = 1;
  string owner = 2;
}

// MsgSetDisplayName sets (or clears) the free-form display name on the
// signer's OwnerInfo. Empty display_name clears the field. Aesthetic
// policing (impersonation similarity, profanity) is a frontend concern;
// chain-level validation is bytes-only.
message MsgSetDisplayName {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgSetDisplayName";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // display_name is the new value. Empty string clears the field.
  string display_name = 2;
}

// MsgSetDisplayNameResponse defines the response for MsgSetDisplayName.
message MsgSetDisplayNameResponse {}

// MsgSetTarget sets (or clears, with empty `target`) the resolver target for
// an owned name. Setting always resets target_accepted to false; the target
// must call MsgAcceptTarget to re-consent.
message MsgSetTarget {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgSetTarget";
  // authority is the current owner of the name.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  // target is the address forward resolution should return. Empty clears the
  // override and falls back to the owner.
  string target = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgSetTargetResponse defines the response for MsgSetTarget.
message MsgSetTargetResponse {}

// MsgAcceptTarget consents to being the resolver target of a name. Authority
// must equal the name's current `target`. Sets target_accepted = true and
// makes the signer eligible to set this name as primary for reverse
// resolution.
message MsgAcceptTarget {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgAcceptTarget";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
}

// MsgAcceptTargetResponse defines the response for MsgAcceptTarget.
message MsgAcceptTargetResponse {}

// MsgTransferName transfers ownership of a name. The new owner must be an
// active x/rep member and must not be over the per-address name cap. Rejected
// while the name has an active dispute (prevents dumping disputed names).
// Existing target / target_accepted state carries over; the new owner can
// revoke by calling MsgSetTarget.
message MsgTransferName {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/name/MsgTransferName";
  // authority is the current owner of the name.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name = 2;
  string new_owner = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgTransferNameResponse defines the response for MsgTransferName.
message MsgTransferNameResponse {}
