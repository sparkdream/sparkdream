syntax = "proto3";
package sparkdream.season.v1;

option go_package = "sparkdream/x/season/types";

// TitleGrant represents a title and its eligible recipients for a season.
message TitleGrant {
  // Title ID
  string title_id = 1;

  // Title name
  string title_name = 2;

  // Members eligible for this title
  repeated string eligible_members = 3;
}

// SeasonTitleEligibility tracks the ranked (TOP_XP) title grants for a
// season. It is built incrementally across the SNAPSHOT batches and holds at
// most the title's threshold (capped) members per grant; threshold titles are
// recorded per member on MemberSeasonSnapshot.eligible_title_ids.
message SeasonTitleEligibility {
  // Key: season number
  uint64 title_season = 1;

  // Season number
  uint64 season = 2;

  // Title grants for this season
  repeated TitleGrant grants = 3;
}
