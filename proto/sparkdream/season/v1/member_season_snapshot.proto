syntax = "proto3";
package sparkdream.season.v1;

import "gogoproto/gogo.proto";

option go_package = "sparkdream/x/season/types";
// Map fields are encoded in sorted key order: an unsorted encoding differs
// between nodes and would split the app hash.
option (gogoproto.stable_marshaler_all) = true;

// MemberSeasonSnapshot stores a member's state at the end of a season.
message MemberSeasonSnapshot {
  // Composite key: season/address
  string season_address = 1;

  // Final DREAM balance at season end
  string final_dream_balance = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  // Final reputation scores by tag
  map<string, string> final_reputation = 3;

  // Number of initiatives completed during the season
  uint64 initiatives_completed = 4;

  // Total XP earned during the season
  uint64 xp_earned = 5;

  // Level achieved at season end
  uint64 season_level = 6;

  // Achievements earned during this season
  repeated string achievements_earned = 7;

  // Seasonal title definitions (threshold requirements) this member met
  // when the SNAPSHOT phase evaluated them, before RESET_XP. The TITLES
  // phase grants `s<N>_<title_id>` from this list. TOP_XP titles are
  // ranked across members and live in SeasonTitleEligibility instead.
  repeated string eligible_title_ids = 8;
}
