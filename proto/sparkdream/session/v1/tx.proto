syntax = "proto3";

package sparkdream.session.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "sparkdream/session/v1/grant.proto";
import "sparkdream/session/v1/params.proto";

option go_package = "sparkdream/x/session/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // UpdateOperationalParams defines an operation for updating the module's
  // operational parameters. Authorized for Commons Council Operations Committee.
  rpc UpdateOperationalParams(MsgUpdateOperationalParams) returns (MsgUpdateOperationalParamsResponse);

  // CreateSession creates a new session key delegation.
  //
  // DEPRECATED in favor of `CreateGrant` with a SessionKeyPayload; kept for
  // pre-launch backward compatibility and removed at P6.
  rpc CreateSession(MsgCreateSession) returns (MsgCreateSessionResponse);

  // RevokeSession revokes an active session.
  //
  // DEPRECATED in favor of `RevokeGrant` (P6); kept for pre-launch backward
  // compatibility.
  rpc RevokeSession(MsgRevokeSession) returns (MsgRevokeSessionResponse);

  // ExecSession executes messages using a session key.
  rpc ExecSession(MsgExecSession) returns (MsgExecSessionResponse);

  // CreateGrant is the unified entrypoint that creates any of the four typed
  // grants. Type is inferred from the payload oneof.
  rpc CreateGrant(MsgCreateGrant) returns (MsgCreateGrantResponse);

  // ClaimRecurringPull disburses one period of a RECURRING_PULL grant from
  // the granter to the grantee. Logical-clock advances; catch-up requires
  // multiple txs.
  rpc ClaimRecurringPull(MsgClaimRecurringPull) returns (MsgClaimRecurringPullResponse);

  // PullAllowance withdraws an amount from a SPENDING_ALLOWANCE grant
  // budget to a chosen recipient (constrained by the optional whitelist
  // and the per-period cap). The grantee picks the recipient and amount
  // per call within the rolling-window budget.
  rpc PullAllowance(MsgPullAllowance) returns (MsgPullAllowanceResponse);

  // RetryScheduledOneshot re-enqueues a PAUSED_INSUFFICIENT_FUNDS
  // ScheduledOneshot for firing. Either the granter or the grantee may
  // call (no additional authorization needed — the granter already
  // authorized the underlying action at creation time). Sets
  // fire_at = block_time on success.
  rpc RetryScheduledOneshot(MsgRetryScheduledOneshot) returns (MsgRetryScheduledOneshotResponse);

  // RevokeGrant cancels any active grant by id. Signed by the granter
  // on file. Refunds any held OneshotGasDeposit for SCHEDULED_ONESHOT
  // grants. A session-key holder may invoke this only when the session
  // key's SessionKeyPayload.allow_self_revoke = true AND the targeted
  // grant's granter matches the session-key granter (anti
  // cross-granter-revoke).
  rpc RevokeGrant(MsgRevokeGrant) returns (MsgRevokeGrantResponse);

  // DeclineGrant lets the grantee opt out of any active grant by id.
  // Applies uniformly across all four grant types. For ScheduledOneshot
  // this is a pre-fire veto: the grant transitions to DECLINED, the
  // EndBlocker skips it, and the held deposit is refunded to the
  // granter. Decline is one-way — the granter must Revoke + CreateGrant
  // to retry.
  rpc DeclineGrant(MsgDeclineGrant) returns (MsgDeclineGrantResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/session/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message MsgUpdateParamsResponse {}

// MsgUpdateOperationalParams is the Msg/UpdateOperationalParams request type.
// Authorized: Commons Council Operations Committee (via IsCouncilAuthorized).
message MsgUpdateOperationalParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "sparkdream/x/session/MsgUpdateOperationalParams";

  // authority is the address authorized to update operational params.
  // Can be: governance authority, Commons Council policy address,
  // or Operations Committee policy address.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // operational_params defines the operational parameters to update.
  SessionOperationalParams operational_params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message MsgUpdateOperationalParamsResponse {}

// MsgCreateSession creates a new session key delegation. Signed by the granter.
message MsgCreateSession {
  option (cosmos.msg.v1.signer) = "granter";
  option (amino.name) = "sparkdream/x/session/MsgCreateSession";

  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string grantee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated string allowed_msg_types = 3;
  cosmos.base.v1beta1.Coin spend_limit = 4 [(gogoproto.nullable) = false];
  google.protobuf.Timestamp expiration = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  uint64 max_exec_count = 6;
}

message MsgCreateSessionResponse {}

// MsgRevokeSession revokes an active session. Signed by the granter.
message MsgRevokeSession {
  option (cosmos.msg.v1.signer) = "granter";
  option (amino.name) = "sparkdream/x/session/MsgRevokeSession";

  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string grantee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgRevokeSessionResponse {}

// MsgExecSession executes messages using a session key. Signed by the grantee.
message MsgExecSession {
  option (cosmos.msg.v1.signer) = "grantee";
  option (amino.name) = "sparkdream/x/session/MsgExecSession";

  string grantee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string granter = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // Inner messages to execute on behalf of the granter (max 10).
  repeated google.protobuf.Any msgs = 3;
}

message MsgExecSessionResponse {}

// MsgCreateGrant is the unified entrypoint for creating any of the four
// typed grants. The grant type is inferred from the payload oneof; the
// handler dispatches to type-specific validation. Signed by the granter.
message MsgCreateGrant {
  option (cosmos.msg.v1.signer) = "granter";
  option (amino.name) = "sparkdream/x/session/MsgCreateGrant";

  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string grantee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  google.protobuf.Timestamp expires_at = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  // Optional human-readable purpose (256-char cap).
  string note = 4;

  oneof payload {
    SessionKeyPayload session_key = 10 [(amino.oneof_name) = "sparkdream/session/SessionKeyPayload"];
    RecurringPullPayload recurring_pull = 11 [(amino.oneof_name) = "sparkdream/session/RecurringPullPayload"];
    SpendingAllowancePayload spending_allowance = 12 [(amino.oneof_name) = "sparkdream/session/SpendingAllowancePayload"];
    ScheduledOneshotPayload scheduled_oneshot = 13 [(amino.oneof_name) = "sparkdream/session/ScheduledOneshotPayload"];
  }
}

message MsgCreateGrantResponse {
  // Allocated grant id.
  uint64 grant_id = 1;
}

// MsgClaimRecurringPull disburses one period of a RECURRING_PULL grant.
// Signed by the grantee on file.
message MsgClaimRecurringPull {
  option (cosmos.msg.v1.signer) = "grantee";
  option (amino.name) = "sparkdream/x/session/MsgClaimRecurringPull";

  string grantee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 grant_id = 2;
}

message MsgClaimRecurringPullResponse {
  // Sequence number of this claim (1-indexed).
  uint64 claim_number = 1;
  // Unix timestamp at which the next claim becomes eligible.
  int64 next_claim_time = 2;
}

// MsgPullAllowance withdraws `amount` from a SPENDING_ALLOWANCE grant
// budget to `recipient`. Signed by the grantee on file.
message MsgPullAllowance {
  option (cosmos.msg.v1.signer) = "grantee";
  option (amino.name) = "sparkdream/x/session/MsgPullAllowance";

  string grantee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 grant_id = 2;
  string recipient = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 4 [(gogoproto.nullable) = false];
}

message MsgPullAllowanceResponse {
  // Amount actually transferred (= request amount, for now). Exposed
  // separately so future variants (e.g., partial fills) keep the wire
  // shape stable.
  cosmos.base.v1beta1.Coin transferred = 1 [(gogoproto.nullable) = false];
  // Total spent in the current rolling-window period after this pull.
  cosmos.base.v1beta1.Coin spent_in_period = 2 [(gogoproto.nullable) = false];
}

// MsgRetryScheduledOneshot flips a PAUSED_INSUFFICIENT_FUNDS oneshot
// back to ACTIVE with fire_at = block_time. Caller must be either the
// granter or the grantee on file.
message MsgRetryScheduledOneshot {
  option (cosmos.msg.v1.signer) = "caller";
  option (amino.name) = "sparkdream/x/session/MsgRetryScheduledOneshot";

  // caller is the address re-enqueueing the oneshot. Must match either
  // the grant's granter or its grantee.
  string caller = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 grant_id = 2;
}

message MsgRetryScheduledOneshotResponse {
  // New fire_at unix timestamp (= block_time).
  int64 new_fire_at = 1;
}

// MsgRevokeGrant cancels any active grant by id. Signed by the granter
// (or a session key with allow_self_revoke = true and same-granter
// scope).
message MsgRevokeGrant {
  option (cosmos.msg.v1.signer) = "granter";
  option (amino.name) = "sparkdream/x/session/MsgRevokeGrant";

  // granter is the address invoking the revocation. Must match the
  // grant's granter field (no cross-granter revocation).
  string granter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 grant_id = 2;
}

message MsgRevokeGrantResponse {
  // refund_amount is the OneshotGasDeposit returned to the granter
  // (empty/zero for non-oneshot grants).
  cosmos.base.v1beta1.Coin refund_amount = 1 [(gogoproto.nullable) = false];
}

// MsgDeclineGrant lets the grantee opt out of an active grant by id.
// One-way; the granter must Revoke + CreateGrant to retry.
message MsgDeclineGrant {
  option (cosmos.msg.v1.signer) = "grantee";
  option (amino.name) = "sparkdream/x/session/MsgDeclineGrant";

  string grantee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 grant_id = 2;
}

message MsgDeclineGrantResponse {
  // refund_amount is the OneshotGasDeposit returned to the granter
  // (empty/zero for non-oneshot grants).
  cosmos.base.v1beta1.Coin refund_amount = 1 [(gogoproto.nullable) = false];
}
